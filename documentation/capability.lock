lope\"}}},\"description\":\"Request deadline was exceeded\"}},\"security\":[{\"bearerAuth\":[]}],\"summary\":\"Read bounded job status and evidence\",\"tags\":[\"Synthetic Data Jobs\"],\"x-juntai-iam\":{\"action\":\"read\",\"audience\":\"juntai.synthetic-data.api\",\"defaultDeny\":true,\"resource\":\"synthetic-data/jobs/{job_id}\",\"tenantSource\":\"verified-casdoor-organization-or-delegated-workload\"}}},\"/v1/jobs/{job_id}/result\":{\"get\":{\"operationId\":\"syntheticData.getJobResult\",\"parameters\":[{\"in\":\"path\",\"name\":\"job_id\",\"required\":true,\"schema\":{\"title\":\"Job Id\",\"type\":\"string\"}}],\"responses\":{\"200\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/JobResult\"}}},\"description\":\"Successful Response\"},\"400\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request does not match the endpoint contract\"},\"403\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request is not authorized for the destination\"},\"404\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Destination or entity was not found\"},\"409\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request authority has already been consumed\"},\"500\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request failed inside the framework boundary\"},\"503\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"HTTP adapter is not accepting requests\"},\"504\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request deadline was exceeded\"}},\"security\":[{\"bearerAuth\":[]}],\"summary\":\"Read the exact immutable dataset Artifact result\",\"tags\":[\"Synthetic Data Jobs\"],\"x-juntai-iam\":{\"action\":\"read\",\"audience\":\"juntai.synthetic-data.api\",\"defaultDeny\":true,\"resource\":\"synthetic-data/jobs/{job_id}\",\"tenantSource\":\"verified-casdoor-organization-or-delegated-workload\"}}},\"/v1/jobs/{job_id}:cancel\":{\"post\":{\"operationId\":\"syntheticData.cancelJob\",\"parameters\":[{\"in\":\"path\",\"name\":\"job_id\",\"required\":true,\"schema\":{\"title\":\"Job Id\",\"type\":\"string\"}}],\"responses\":{\"200\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/JobStatus\"}}},\"description\":\"Successful Response\"},\"400\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request does not match the endpoint contract\"},\"403\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request is not authorized for the destination\"},\"404\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Destination or entity was not found\"},\"409\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request authority has already been consumed\"},\"500\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request failed inside the framework boundary\"},\"503\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"HTTP adapter is not accepting requests\"},\"504\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request deadline was exceeded\"}},\"security\":[{\"bearerAuth\":[]}],\"summary\":\"Request best-effort job cancellation\",\"tags\":[\"Synthetic Data Jobs\"],\"x-juntai-iam\":{\"action\":\"cancel\",\"audience\":\"juntai.synthetic-data.api\",\"defaultDeny\":true,\"resource\":\"synthetic-data/jobs/{job_id}\",\"tenantSource\":\"verified-casdoor-organization-or-delegated-workload\"}}}},\"security\":[{\"bearerAuth\":[]}]}\n"},"schemas":[],"units":[{"audiences":["human","agent","developer","operator"],"content":"# Synthetic Data Generation\n\nSynthetic Data Generation 1.3.0 creates bounded, deterministic candidate datasets as immutable\nArtifacts. The service owns asynchronous jobs, structural contract validation, provider selection,\nprivacy policy, quota reservation, the `juntai.synthetic.worker/v1` protocol, isolated generation,\noptional exact validator execution, publication, and provenance.\n\nThe output is an immutable dataset Artifact. It is not imported application data and does not authorize a write to any target datastore. A separate authorized owner decides whether and how to ingest it.\n\n## Supported public flow\n\n- Create a job with `POST /v1/jobs/` and a bounded `Idempotency-Key`.\n- Poll `GET /v1/jobs/{job_id}` until a terminal state.\n- Request best-effort cancellation with `POST /v1/jobs/{job_id}:cancel` before publication commits.\n- Read an exact successful result with `GET /v1/jobs/{job_id}/result`.\n- Resolve dataset bytes only through the Artifact client using the returned exact reference.\n\n## Ownership boundary\n\nThe service accepts generic record families, primitive field types, distributions, relations, limits, output format, policy, provider requirements, seed, and an optional exact validator Artifact. It does not interpret product-domain meaning, receive target-store credentials, ingest results, deploy previews, or promote data.\n\nThe API coordinator alone writes Synthetic job metadata in KES. Platform owns the durable SWP\ndispatch, control, result, and dead-letter queues, generic delivery ledger, and executor Deployment.\nThe relay reaches only the executor's authenticated QueueTransport listener on the injected literal\nClusterIP:7444; it receives no Kafka or Platform-ledger credential and remote readiness must pass\nbefore a Synthetic KES outbox lease.\nEach committed claim creates a separately fenced worker Job Pod. The worker owns generation and\nimmutable Artifact publication behind the authenticated remote SWP stream. The Unix socket remains\nlocal-test framing only. The worker has no\nKES, queue, Synthetic API, or Kubernetes API capability.\n\nThe pinned FuseAPI 2.0.0 MCP descriptor contains no Tools because this release exposes HTTP only.\nThis bundle therefore publishes MCP Resources for the same reviewed documentation units and does\nnot invent MCP Tools or Prompts.\n\n## Exact release binding\n\n- Service source, image, OpenAPI, MCP descriptor, SWP schema, queue adapter, stream client, and\n  documentation/capability digests are populated only by the final immutable 1.3.0 release build.\n- SWP schema: `contracts/worker-protocol/swp.v1.schema.json` in the service release.\n- Documentation packager and renderers: `JuntaiDocumentationCapabilityBundle` `v1.0.0`\n","contentDigest":"sha256:1eb5395d9a2f23dd415d5c6ff9d2f4ec2e8487965254621db2c9372dfeb3ea48","kind":"overview","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.overview"},"order":0,"schemaReferences":[],"sourcePath":"guides/overview.md","title":"Synthetic Data Generation service","toolReferences":[],"unitId":"synthetic-data.overview"},{"audiences":["human","agent","developer"],"content":"# Create a bounded generation job\n\n1. Obtain a human or delegated bearer token with audience `juntai.synthetic-data.api`, scope\n   `synthetic-data:jobs`, and authorization for action `create` on `synthetic-data/jobs`.\n2. Construct `juntai.synthetic-data.request/v1` with one generic `GenerationContract`, a non-empty seed, provider requirements, and policy.\n3. Set `Idempotency-Key` to a stable opaque value of at most 200 characters. Reuse it only for the identical canonical request.\n4. Call `POST /v1/jobs/` with JSON content.\n5. Persist the returned `job_id`, `request_digest`, state, and quota reservation for polling and\n   audit. Acceptance means the API has atomically committed the queued attempt and SWP dispatch\n   outbox after publishing the exact worker-input Artifact.\n\nThe service accepts the same key and identical canonical request as a replay of the same job. Reusing the key with different content fails with `IDEMPOTENCY_KEY_REUSED`.\n\nSchema-only generation is the default: use `source_examples: none`. A minimized source-derived request requires an explicit `authorization_reference` and remains subject to classification policy.\n\nDo not include credentials, target namespaces, executable expressions, unbounded counts, or mutable Artifact aliases in the request.\n","contentDigest":"sha256:ac50dc8b9c4f497b67ddbe8d285f89666de75153618908f5856c52f301d23e8c","kind":"workflow","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.workflow.create"},"order":10,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"workflows/create-job.md","title":"Create a bounded generation job","toolReferences":[],"unitId":"synthetic-data.workflow.create"},{"audiences":["human","agent","developer","operator"],"content":"# Monitor or cancel a job\n\nPoll `GET /v1/jobs/{job_id}` with bounded backoff. The response returns state, stage, timestamps, request digest, optimistic-concurrency version, bounded quota details, and a stable failure when present.\n\nThe normal sequence is `ACCEPTED`, `POLICY_CHECK`, `QUEUED`, `RUNNING`, `VALIDATING`, `PUBLISHING`, then `SUCCEEDED`. `FAILED` and `CANCELLED` are terminal. `CANCELLING` records a best-effort request in progress.\n\nTo cancel, obtain a correct-audience bearer token and authorization for action `cancel` on\n`synthetic-data/jobs/{job_id}` and call `POST /v1/jobs/{job_id}:cancel`. Cancellation is idempotent.\nThe API increments a monotonic cancel sequence and atomically records the control outbox. The\nexecutor forwards the highest sequence over the authenticated fenced stream, allows the specified grace interval,\nthen terminates the worker if necessary. A success arriving after cancellation committed is not\nassociated with the job. Cancellation cannot delete or mutate an Artifact whose publication already\ncommitted.\n\nDo not treat cancellation as revocation of an already published dataset. Retention and downstream authorization are separate concerns.\n","contentDigest":"sha256:c92b4d2cfa6625e1be4e446a2343909021643e698bf670f30e8542701bee2201","kind":"workflow","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.workflow.monitor-cancel"},"order":20,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"workflows/monitor-and-cancel.md","title":"Monitor or cancel a job","toolReferences":[],"unitId":"synthetic-data.workflow.monitor-cancel"},{"audiences":["human","agent","developer","operator"],"content":"# Resolve a successful dataset result\n\n1. Confirm `GET /v1/jobs/{job_id}` reports `SUCCEEDED`.\n2. Obtain a bearer token with audience `juntai.synthetic-data.api` and authorization for action\n   `read` on `synthetic-data/jobs/{job_id}`.\n3. Call `GET /v1/jobs/{job_id}/result`.\n4. Verify the exact Artifact reference, dataset manifest digest, format, compression, counts, seed, validator result, and provenance.\n5. Resolve and download bytes through the approved backend Artifact client using `artifact_id`, `version_id`, and `digest` together.\n\nThe API does not return payload bytes, OCI credentials, target-store credentials, or a mutable download URL. `SUCCEEDED` means both direct OCI publication and generic metadata registration completed.\n\nPreserve provenance with the dataset reference. It binds request and contract digests, provider and model identity, seed, policy, quota reservation, worker image, validator evidence, logical dataset digest, Artifact digest, counts, shards, and timestamps.\n\n`SUCCEEDED` is committed only after the API coordinator verifies the authenticated Platform executor,\nexact tenant/attempt/input/image bindings, required SWP capabilities, dataset Artifact, and execution\nevidence Artifact. Replayed event IDs with the same digest are idempotent; a different digest is a\nconflict and never changes the result.\n","contentDigest":"sha256:fdbf2edfdfbc01de532c85460718bf3c9f79aeb55641d5d774a11593ddb72025","kind":"workflow","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.workflow.result"},"order":30,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"workflows/resolve-result.md","title":"Resolve a successful dataset result","toolReferences":[],"unitId":"synthetic-data.workflow.result"},{"audiences":["human","agent","developer"],"content":"# Exact HTTP API and lifecycle\n\nThis bundle binds the exact generated 1.3.0 OpenAPI and its reviewed Synthetic source commit. The\nimmutable digest and commit are recorded in `documentation/manifest.yaml`, the capability lock,\npublication result, checksums, SBOM, and provenance.\n\n| Method and path | Operation ID | Purpose |\n| --- | --- | --- |\n| `POST /v1/jobs/` | `syntheticData.createJob` | Create or replay an asynchronous job. |\n| `GET /v1/jobs/{job_id}` | `syntheticData.getJob` | Read bounded status and evidence. |\n| `POST /v1/jobs/{job_id}:cancel` | `syntheticData.cancelJob` | Request best-effort cancellation. |\n| `GET /v1/jobs/{job_id}/result` | `syntheticData.getJobResult` | Read one exact immutable result after success. |\n\nAll response models reject unknown fields. Digests use lowercase `sha256:` values. `JobStatus` carries `job_id`, `state`, `stage`, `request_digest`, version, timestamps, optional quota, and optional failure. `JobResult` carries one Artifact reference plus exact dataset and provenance facts.\n\nEvery operation uses the reviewed HTTP bearer scheme. Tokens must have the exact audience\n`juntai.synthetic-data.api` and scope `synthetic-data:jobs`. The service authenticates a human or\ndelegated identity, takes tenant authority only from the verified token, and authorizes `create`,\n`read`, or `cancel` against the exact job resource. Caller-supplied tenant identifiers are not\nauthoritative; missing, invalid, wrong-audience, or unauthorized credentials fail closed.\n\nCreating a job atomically records a SWP attempt and canonical dispatch outbox record after the\nimmutable input Artifact is published. Worker progress is visible only after the API coordinator\nauthenticates the pinned Platform executor, verifies the canonical envelope and exact Artifacts,\nand commits the event with the job transition in KES.\n\nThis release has no MCP Tools. Its exact FuseAPI descriptor is still packaged and verified so consumers fail closed if later builds add or change a runtime surface.\n","contentDigest":"sha256:57fdfc4fda1bb813ecd40f4ae31e8502f205525d7fda559d252f53677186e7a3","kind":"reference","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.reference.api"},"order":40,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"reference/api-and-lifecycle.md","title":"Exact HTTP API and lifecycle","toolReferences":[],"unitId":"synthetic-data.reference.api"},{"audiences":["human","agent","developer"],"content":"# Generation contract reference\n\n`juntai.synthetic-data.contract/v1` describes bounded structure only.\n\n- `records` contains 1 to 64 uniquely named record families.\n- Each family declares a positive maximum count and 1 to 256 fields.\n- Field types are `string`, `integer`, `number`, `boolean`, `date`, or `datetime`.\n- Distributions are `constant`, `sequence`, `choice`, `uniform`, `normal`, or `uuid` with kind-specific required parameters.\n- A relation uses `record.field` endpoints. Its target field must be declared unique.\n- `bounds` limits total records, bytes, and shards. Declared family counts must fit `max_records`.\n- Output is `jsonl` or `csv`, with `none` or `gzip` compression.\n- Metadata is bounded opaque text; it is not interpreted as domain semantics.\n\nHard public maxima are 1,000,000 records, 1,073,741,824 bytes, 15 shards, 64 record families, 256 fields per family, and 256 relations. Tenant policy and quota may impose lower limits.\n\nThe provider request declares class, deterministic requirement, modes, and maximum runtime. The default released provider class is `tabular`. Deterministic jobs pin the seed and provider behavior; a provider that cannot satisfy determinism fails before generation.\n","contentDigest":"sha256:4e4ef504ded5b18eb0dcfdc74e92901b6485a5b0c892edfdeebb8855f43b4509","kind":"reference","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.reference.contract"},"order":50,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"reference/generation-contract.md","title":"Generation contract reference","toolReferences":[],"unitId":"synthetic-data.reference.contract"},{"audiences":["human","agent","developer","operator"],"content":"# Exact validator Artifact reference\n\nA validator is optional. When supplied, it must contain immutable `artifact_id`, `version_id`, lowercase SHA-256 digest, media type, runtime, documented entry point, protocol versions, resource limits, and a deterministic declaration.\n\nThe service resolves the exact Artifact through `juntai-artifact-client`, verifies the returned manifest digest, and executes it in a no-network, read-only, non-root sandbox with bounded CPU, memory, time, and findings.\n\nThe entry point format is `module.path:function`. Supported runtimes are `python` and `wasm`. The validator input and output protocols are `juntai.synthetic-data.validator-input/v1` and `juntai.synthetic-data.validator-output/v1`.\n\nA validator must not start a server, database connection, engine, background thread, or network client. It must not mutate candidate data. Digest drift, side effects, timeout, unbounded findings, or a failed result prevents dataset publication.\n\nNever submit a mutable tag, unpinned package name, local filesystem path, or credential as a validator reference.\n","contentDigest":"sha256:4247da41732fb133203915992eed95526a76f5b09128f7c391c11a4243fd6992","kind":"reference","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.reference.validator"},"order":60,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"reference/validator-artifact.md","title":"Exact validator Artifact reference","toolReferences":[],"unitId":"synthetic-data.reference.validator"},{"audiences":["human","agent","developer","operator"],"content":"# Synthetic Worker Protocol v1\n\n`juntai.synthetic.worker/v1` is the only supported execution boundary. Platform owns durable queues\nnamed `synthetic.worker.dispatch.v1`, `synthetic.worker.control.v1`,\n`synthetic.worker.result.v1`, and `synthetic.worker.dead-letter.v1`. Synthetic owns the canonical\ndispatch, cancel, worker-event, Artifact, identity, resource, retry, and stable-error schemas.\n\nThe generic Platform executor commits a fenced claim and starts one digest-pinned worker Job Pod.\nThe worker initiates the approved TLS 1.3 HTTP/2 Attach stream to the injected executor\nClusterIP:7443 with exact server name, pinned CA, and Pod-bound audience token. Each Data message\ncontains exactly one existing frame: a four-byte unsigned big-endian length followed by at most 1,048,576 bytes of canonical\nRFC 8785 UTF-8 JSON. Unknown members, duplicate members, non-canonical bytes, unsupported majors,\ndigest mismatch, sequence gap/replay, stale claim generation, or transport/producer identity\nmismatch fail closed. `/var/run/juntai-worker/swp-v1.sock` is local-test framing only.\n\n`WorkerSession.send_result(sequence, framed_bytes, terminal, timeout)` succeeds only after the\nexecutor has durably committed the exact complete-frame SHA-256 tuple and returned\n`ResultAccepted` (executor message tag 5); local enqueue is never acceptance. If that acknowledgement\ntimes out or the link becomes unavailable, the worker closes the old client, performs fresh Auth and\nAccepted for the same live claim generation, requires the dispatch frame to be byte-identical, and\nresends exactly the pending `(sequence, framed_bytes, terminal)` once. It never reruns the engine,\nchanges the tuple, parses the acknowledgement or Platform ledger, or continues after a second\nfailure. A terminal acknowledgement precedes session/client close.\n\nDispatch carries exact tenant, job, attempt, sequence, deadline, correlation, input Artifact,\nrequest digest, provider/version, worker image, capabilities, executor binding, resource envelope,\nand idempotency digest. Worker events carry lease, stage/progress, observed cancellation sequence,\nimage/capabilities, evidence counters, and—when terminal—outcome, times, consumed input digest,\nimmutable execution evidence, stable error, and successful dataset Artifact/counts.\n\nQueue visibility is 60 seconds and the executor renews every 20 seconds. Platform's durable generic\nledger commits claim generations one through five before execution, applies full-jitter retry timing,\ncreates exactly one DLQ outbox on the fifth failure, and forbids a sixth claim. Synthetic receives\nauthenticated result/DLQ evidence and acknowledges only after its KES inbox/lifecycle transaction.\nCancellation is monotonic;\nthe executor allows 30 seconds for graceful worker exit and a 60-second termination allowance.\n\nThe API outbox makes dispatch/control publication replayable. The result inbox makes event IDs\nidempotent and detects digest conflicts. On restart, the API reconciles pending outbox records and\nnonterminal attempts; the executor relies on its durable ledger, queue redelivery, and fenced claim\nidentity. A new\nworker image is rolled out only after protocol/real-KES/isolation acceptance. Rollback re-pins a\ncompatible prior image; migrations remain forward-only and no component performs a destructive\nimplicit downgrade.\n","contentDigest":"sha256:f486247e1b491f6b78a1abbdeb764f77f63bdfb06b6fdf8807a05361eb687984","kind":"reference","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.reference.worker-protocol"},"order":65,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"reference/worker-protocol.md","title":"Synthetic Worker Protocol v1","toolReferences":[],"unitId":"synthetic-data.reference.worker-protocol"},{"audiences":["human","agent","developer","operator"],"content":"# Service-owned SWP transport relay\n\nThe `relay` entry point is the API-side bridge between Synthetic's KES truth and the four generic\nPlatform queue capabilities. It is not the Platform executor, a queue resource definition, a\ndelivery ledger, or a worker transport. Synthetic owns the relay loop and the `QueueTransport` SPI;\nPlatform supplies `juntai-platform-queue-kafka==1.0.0`. The Python factory/session callable addendum\nand exact local conformance artifacts are externally supplied and are not reimplemented here. The\nservice pins manifest SHA-256\n`7d50a9e7b6733c88082ecb9e9a433801de69a7b1f99286137c69470e6c03216b`, Platform source commit\n`3dc2dd844194db8a6891590f7d088b437c34fc5f`, source tree\n`5996502910b04eda3a1ab56fd8d1f94a38e3d3de`, queue wheel SHA-256\n`d787126955c11e27ec05ca7c22e8f945cf0a89bf989c1e438ee86640e56622dc`, and stream wheel SHA-256\n`cba7a87783cd804f5e496473f0961757c27a0455b946ed82041a7d1d01ef6033`.\n\n## Synthetic-owned durable behavior\n\n- Lease a bounded batch of unpublished `worker_outbox` rows with `FOR UPDATE SKIP LOCKED`, an\n  opaque lease token, a 60-second expiry, and a monotonically increasing publish-attempt count.\n- Decode and revalidate the stored canonical bytes before publication. Channel, tenant, job,\n  attempt, message, sequence, and content digest must match the KES row.\n- Publish the exact stored bytes with `messageId`, `contentDigest`, and `orderingKey`. Dispatch uses\n  `messageId`; control uses the 64 lowercase hexadecimal SHA-256 of the exact domain-separated bytes\n  `juntai.synthetic.control-order/v1\\0<tenant>\\0<job>\\0<attempt>`. The key reveals no component and\n  Platform may order but never decode or derive it. Mark `published_at` and\n  `platform_publication_id` only after the transport confirms\n  the same identity and digest.\n- Treat a broker acknowledgement followed by a failed KES mark as a safe replay. The next relay\n  publishes the same bytes and idempotency identity after the KES lease expires.\n- Lease result and dead-letter deliveries for 60 seconds and renew every 20 seconds while the\n  service verifies identity, content, Artifact references, and KES state.\n- Acknowledge a result only after the result inbox disposition and every valid lifecycle change\n  commit in one KES transaction. Request release for transient failures and reject only under the\n  transport contract. Platform's durable ledger—not service state—owns retry timing and generations\n  one through five and the unique fifth-failure DLQ transition.\n- Commit dead-letter identity, digest, original bytes, producer identity, delivery evidence, and\n  lifecycle disposition transactionally. Exact replays are idempotent; changed content conflicts.\n\n## Exact transport-neutral SPI\n\nThe generated `contracts/worker-protocol/queue-capability.v1.json` is the machine-readable contract.\nThe Python SPI has these operations:\n\n| Operation | Service input | Required result |\n| --- | --- | --- |\n| `binding_metadata` | none | Exact profile, four channels, provider compatibility, visibility, retry/DLQ, and idempotent-publish facts |\n| `publish` | channel, message ID, content digest, canonical bytes, opaque ordering key | Same message ID/digest plus stable bounded publication ID |\n| `receive` | result or DLQ channel, bounded batch, 60-second visibility | Canonical bytes, opaque receipt, delivery count, expiry, and authenticated producer |\n| `renew` | opaque receipt and bounded visibility | Generation-fenced renewal; no service-content mutation |\n| `acknowledge` | opaque receipt | Generation-fenced settlement after KES commit |\n| `release` | opaque receipt | Generation-fenced retry request; Platform alone computes durable cryptographic full-jitter timing |\n| `reject` | opaque receipt and bounded stable reason | Generation-fenced permanent-failure request |\n\nAn approved adapter must pass this seven-operation conformance checklist without changing the SPI:\n\n1. `binding_metadata`: exact byte-for-byte metadata fixture passes; every missing or changed fact\n   prevents relay startup before a KES lease or queue operation.\n2. `publish`: two calls with the same message ID, digest, bytes, and ordering key return the same\n   publication ID; the same ID with changed digest fails closed; control without the exact stable\n   Synthetic key fails; a broker success/KES-mark failure is safely replayed.\n3. `receive`: only result/DLQ are available to the Synthetic principal; batches are bounded; every\n   delivery provides original canonical bytes, count, expiry, opaque receipt, and authenticated\n   producer; spoofed or missing identity fails closed.\n4. `renew`: a long KES/Artifact verification renews before 20 seconds, never beyond the original\n   deadline plus termination allowance or six hours, and a failed renewal never becomes an ack.\n5. `acknowledge`: result ack is observable only after the inbox/state transaction; a crash before\n   commit redelivers, and a crash after commit resolves through the stored duplicate disposition.\n6. `release`: transient queue/KES failure preserves bytes and attempt identity. The service passes\n   only the opaque receipt; Platform atomically applies cryptographic full jitter in 5–300 seconds\n   and increments its durable claim generation on the next committed claim.\n7. `reject`: permanent protocol/authentication failures stay inside Platform's same five-generation\n   state machine. DLQ delivery preserves the original bytes/digest and includes authenticated\n   original channel, count=5, terminal reason, and ledger-evidence identity.\n\nRuntime configuration maps to the SPI without interpreting transport topology:\n\n| Required adapter field | Current code/config mapping |\n| --- | --- |\n| Approved adapter identity | `JUNTAI_QUEUE_TRANSPORT_FACTORY=juntai_platform_queue_kafka:create_transport`; exact distribution `juntai-platform-queue-kafka==1.0.0` |\n| Dispatch endpoint/address | `JUNTAI_QUEUE_DISPATCH_ENDPOINT`; passed opaquely to the adapter |\n| Control endpoint/address | `JUNTAI_QUEUE_CONTROL_ENDPOINT`; passed opaquely to the adapter |\n| Result endpoint/address | `JUNTAI_QUEUE_RESULT_ENDPOINT`; passed opaquely to the adapter |\n| Dead-letter endpoint/address | `JUNTAI_QUEUE_DEAD_LETTER_ENDPOINT`; passed opaquely to the adapter |\n| Projected workload credential | Exact mode-0400 `/var/run/secrets/juntai/queue-binding/credentials.json`, schema `juntai.platform.queue-credential/v1`; never copied into an envelope or KES |\n| Immutable callable contract | `JUNTAI_QUEUE_CONTRACT_MANIFEST_FILE` plus exact lowercase `JUNTAI_QUEUE_CONTRACT_MANIFEST_SHA256`; verified before service/KES construction |\n| Provider compatibility | `binding_metadata` proves Apache Kafka `4.1.1`, image digest `sha256:0bc1bb…d40`, and the exact queue-binding profile |\n| Publish idempotency | `publish(messageId, contentDigest, canonicalBytes, orderingKey)`; changed digest for one ID must fail closed |\n| Result authentication | Every result delivery carries the queue-authenticated producer workload used by envelope verification |\n| Receipt lifecycle | `receive`, `renew`, `acknowledge`, `release`, and `reject`; receipts stay transport metadata |\n| DLQ preservation | DLQ deliveries add original channel, original count=5, original digest, terminal reason, and ledger-evidence ID while preserving bytes |\n\n## Fail-closed readiness\n\nThe relay will not start when the exact factory/version, any exact\n`grpcs://[literal-executor-Service-ClusterIP]:7444/<logical-channel>?serverName=swp-executor.juntai-platform.svc.cluster.local`\nendpoint, the shared endpoint authority, mode-0400 credential binding/schema, external QueueTransport\ndescriptor/profile, or capability metadata is missing. Direct Kafka, KES, DNS, localhost, public,\nalternate-port/server-name, credential-bearing, and extra-query endpoints are rejected. The projected\ncertificate identifies the `synthetic-relay` service principal and is scoped to resource\n`urn:juntai:platform:queue-transport` and audience `juntai-platform-queue-transport`; it is not a Kafka\nor Platform-KES credential.\n\n`binding_metadata` is the authenticated remote readiness check and must succeed before the Synthetic\nservice or repository is constructed and before any KES outbox lease. It proves the four channels,\nat-least-once Platform-ledger-authoritative delivery, idempotent publish, 60-second visibility,\n20-second renewal, maximum five deliveries, DLQ preservation, and Apache Kafka 4.1.1 compatibility.\nThe proxy has no direct-broker, KES, in-memory-ledger, or delivery-counter fallback. The supplied\nadapter/descriptor artifacts pass exact local backend conformance. Production startup additionally\nrequires the separately published IAM 1.1 tuple and a valid authenticated credential; artifact\npresence alone is not deployed admission evidence.\n\nThe adapter may not expose Synthetic KES to Platform, add Platform durable delivery accounting to this\nservice, rewrite canonical bytes, invent a callback route, bypass a logical channel, or enter the\nworker import/environment/mount/network closure.\n\n## Production worker stream boundary\n\nProduction does not expose `/var/run/juntai-worker/swp-v1.sock`; that path is retained only for\nisolated unit/local-development framing tests. Production uses\n`juntai-platform-swp-stream==1.0.0` and `juntai_platform_swp_stream:create_worker_client` over the\nworker-initiated TLS 1.3 HTTP/2 Attach stream to the injected executor ClusterIP:7443, pinned CA,\nexact server name, and Pod-bound audience token. The worker receives no queue endpoint, receipt,\ncredential, KES/API/Kubernetes credential, arbitrary callback, DNS/world route, or Platform ledger\ntype. Production parses exactly `JUNTAI_SWP_TRANSPORT_FACTORY`, `JUNTAI_SWP_EXECUTOR_ADDRESS`,\n`JUNTAI_SWP_EXECUTOR_CA_FILE`, `JUNTAI_SWP_WORKLOAD_TOKEN_FILE`, `JUNTAI_SWP_CLAIM_ID`,\n`JUNTAI_SWP_CLAIM_GENERATION`, `JUNTAI_SWP_POD_UID`, `JUNTAI_SWP_CONTRACT_MANIFEST_FILE`, and\n`JUNTAI_SWP_CONTRACT_MANIFEST_SHA256`. The factory and manifest are verified before Artifact or\nengine construction. `SocketWorker.process` remains the local framing/engine primitive; a thin\nservice-owned `recv`/`sendall` bridge carries complete frames over the authenticated Platform\nsession without implementing TLS, Auth, queue, ledger, retry, or receipt behavior. `send_result`\nreturns only after durable `ResultAccepted`. Timeout or link loss permits one fresh authenticated\nsession for the same claim and one byte-identical pending-tuple resend after the reissued dispatch is\nalso byte-identical. Terminal acceptance is observed before close; no Platform acknowledgement or\nledger state is parsed by Synthetic.\n","contentDigest":"sha256:356a10eda2c4c300c71ed99cfe3ae03752faf8f510ab87cf1f463bb4198b5b54","kind":"reference","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.reference.transport-relay"},"order":66,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"reference/transport-relay.md","title":"Service-owned transport relay","toolReferences":[],"unitId":"synthetic-data.reference.transport-relay"},{"audiences":["human","agent","developer","operator"],"content":"# Authorization, policy, and approvals\n\nEvery operation requires a bearer access token with exact audience `juntai.synthetic-data.api`,\nverified human or delegated identity, the `synthetic-data:jobs` scope, and an authorization decision\nfor the exact resource and action. Service tokens without the required caller context are not a\nsubstitute.\n\nThe runtime pins `juntai-iam==1.1.0` and its exact dependency\n`juntai-iam-contracts==1.1.1`. It verifies contract-manifest SHA-256\n`64dafb25c54d40320347c8661960d23ba524a2d3c102d112c08c95679d12db85` before\nconstructing authorization. The published IAM library—not this service—owns token validation,\npeer-principal identity, live delegation intersection, stable IAM failures, and policy evaluation.\nA service or self-authorized agent token cannot substitute for the required human/delegated caller\ncontext; stale epochs, mismatched audience/resource/tenant, or incomplete grant context deny without\nfallback.\n\nThe default policy permits `synthetic` and `internal` classifications. It denies `confidential` and `restricted` requests. `source_examples` defaults to `none`; `minimized` requires an explicit `authorization_reference`. Validators must declare deterministic behavior.\n\nQuota is reserved before execution for concurrent jobs, daily jobs, records, bytes, compute time, provider class, model tokens, and retained evidence. A caller must reduce bounds or wait for the reported quota window rather than bypass policy.\n\nCreating a job authorizes bounded generation only. It does not authorize ingestion, mutation of an authoritative datastore, preview deployment, or production promotion. Those decisions remain with the separately authorized owner.\n\nCancellation is best effort before publication commit. Confirm the intended `job_id`; cancelling one job cannot revoke or rewrite an already published Artifact.\n\nSWP result messages require the pinned Platform executor workload identity and the job tenant,\nattempt, worker image, input digest, and required protocol capabilities. Transport identity,\n`producerWorkload`, and content digest must agree. The API rejects spoofed or stale results and is\nthe sole component permitted to change job state in KES.\n","contentDigest":"sha256:17bd81db8a7a45235c14c9de808e3f439de3bcaae74d79cca0597b673e75f20a","kind":"safety","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.safety.authorization"},"order":70,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"safety/authorization-and-policy.md","title":"Authorization, policy, and approvals","toolReferences":[],"unitId":"synthetic-data.safety.authorization"},{"audiences":["human","agent","developer","operator"],"content":"# Privacy, isolation, and immutable output\n\nPrefer schema-only generation. Do not send secrets, credentials, protected payloads, raw production rows, target-store bindings, or unrestricted source examples.\n\nWorkers use digest-pinned images, read-only roots, bounded CPU, memory, process, time, and storage,\nleast-privileged Artifact publication identity, and ephemeral workspaces. The separate worker Job\nPod receives only exact Artifact credentials, the executor ClusterIP:7443 address and pinned CA, and\na Pod-bound token whose sole audience is `juntai-platform-swp-executor`. It must not receive a KES DSN,\nKES secret or mount, queue endpoint/token, Synthetic API credential, default service-account token,\nKubernetes API configuration, or network route to KES, queue, Synthetic API, or Kubernetes API.\nPlatform allows only the executor, reviewed Artifact Registry/OCI, OTel, and explicitly declared\nprovider endpoints. DNS/world egress remains denied. Validator isolation is stricter.\n\nCandidate files remain bounded by the request and quota. The worker creates canonical shards and a manifest, publishes bytes directly through the Artifact SDK to OCI, verifies digests and media types, registers generic metadata, records the exact reference, and removes temporary data.\n\nProvenance must not contain credentials or target-store authority. Telemetry uses bounded identifiers and digests, not dataset payloads or authored documentation bodies.\n\nEvery successful job points to one immutable Artifact. Never replace an exact digest with `latest`, a channel, a short-lived URL, or a local path.\n\nThe generic Platform executor Deployment owns queue receipts, the durable delivery ledger,\ngeneration fencing, retry timing, the fifth-failure DLQ transition, and per-claim Job termination.\nIt is a separate Pod and identity from every worker. Cilium policy-enforcement-always and namespace\ndefault deny must be proven before a canonical frame is released. The local Unix socket is used only\nby isolated framing tests and is forbidden in production rendering.\n\nThe Synthetic relay's mTLS credential identifies only its service principal for the executor\nQueueTransport resource/audience on port 7444. It is not a Kafka or Platform-KES credential. Relay\negress to Kafka, Platform KES, worker Attach, Kubernetes workload management, and arbitrary network\nremains denied; wrong peer identity, server name, audience/resource, channel, or operation fails\nclosed before a Synthetic KES lease.\n","contentDigest":"sha256:27e9dbfc0a709814cd76844bee77f51d32b3600fc37f39691c7140e73e1c4f16","kind":"safety","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.safety.isolation"},"order":80,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"safety/privacy-and-isolation.md","title":"Privacy, isolation, and immutable output","toolReferences":[],"unitId":"synthetic-data.safety.isolation"},{"audiences":["human","agent","developer","operator"],"content":"# Stable failures and recovery\n\n- `CONTRACT_INVALID`: correct the structural contract; do not retry unchanged input.\n- `PROVIDER_UNSUPPORTED` or `DETERMINISTIC_SEED_INCOMPATIBLE`: choose supported declared requirements.\n- `POLICY_DENIED`: remove disallowed input or obtain the required authorization; do not bypass policy.\n- `QUOTA_EXCEEDED`: reduce bounds or wait for the quota window. The failure is retryable only as reported.\n- `IDEMPOTENCY_KEY_REUSED`: use the original identical request or a new key for changed content.\n- `VALIDATOR_FAILED` or `SANDBOX_VIOLATION`: correct the exact validator or candidate contract. No dataset is published.\n- `OUTPUT_LIMIT_EXCEEDED`: reduce record or byte bounds. Temporary data is removed.\n- `PUBLICATION_FAILED`, `DEPENDENCY_UNAVAILABLE`, or `DEPENDENCY_DEADLINE`: retry identical content with bounded backoff only when `retryable` is true.\n- `JOB_NOT_FOUND`: verify tenant authority and exact job ID.\n- `JOB_NOT_SUCCEEDED`: continue polling or inspect the terminal failure before requesting a result.\n- `JOB_CANCELLED`: create a new job if generation is still required.\n- `CONCURRENCY_CONFLICT`: reread status and retry the intended operation against current state.\n- `PROTOCOL_UNSUPPORTED` or `ENVELOPE_INVALID`: quarantine the delivery; deploy an executor that\n  supports SWP/v1 rather than rewriting the frame.\n- `ENVELOPE_DIGEST_MISMATCH`, `IDENTITY_MISMATCH`, `TENANT_MISMATCH`, or `RESULT_CONFLICT`: fail\n  closed and investigate transport/integrity evidence; never acknowledge as success.\n- `ATTEMPT_STALE` or `RESULT_DUPLICATE`: do not reapply job state. Record cleanup evidence for any\n  newly published orphan Artifact.\n- `WORKER_EXITED` or retryable `DEPENDENCY_UNAVAILABLE`: Platform applies full-jitter scheduling\n  inside the original deadline and durable five-generation budget; Synthetic does not count claims.\n- `SWP_DEADLINE_EXCEEDED` or `SWP_DEPENDENCY_UNAVAILABLE` while awaiting `ResultAccepted`: close\n  the old Attach client, reauthenticate the same live claim, verify the dispatch bytes are identical,\n  and resend only the identical pending result tuple once. Never rerun the engine or treat enqueue as\n  acceptance.\n- `SWP_RESULT_CONFLICT`, `SWP_SEQUENCE_INVALID`, `SWP_SESSION_CLOSED`, or changed replayed dispatch:\n  fail closed. Do not alter the result frame, infer ledger state, or open a new claim generation.\n- `DELIVERY_EXHAUSTED`: inspect the dead-letter record and immutable evidence. Automated retries\n  stop after five deliveries.\n- `ARTIFACT_INTEGRITY_FAILED`: do not associate the output; exact coordinates, tenant, media type,\n  producer build, or digest verification failed.\n\nNever recover by weakening digest checks, switching to a mutable input, querying private storage, or treating a partial upload as a successful result.\n","contentDigest":"sha256:53256a7205aecf54845e24125c9be65d299a7cb43b3c26dc7ccbaed9966eb921","kind":"troubleshooting","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.troubleshooting.failures"},"order":90,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"troubleshooting/stable-failures.md","title":"Stable failures and recovery","toolReferences":[],"unitId":"synthetic-data.troubleshooting.failures"},{"audiences":["human","agent","developer"],"content":"{\n  \"expectedOutcome\": {\n    \"request_digest\": \"sha256:<canonical-request-digest>\",\n    \"state\": \"ACCEPTED\"\n  },\n  \"expectedToolCalls\": [],\n  \"input\": {\n    \"body\": {\n      \"contract_version\": \"juntai.synthetic-data.request/v1\",\n      \"generation_contract\": {\n        \"bounds\": {\n          \"max_bytes\": 1048576,\n          \"max_records\": 3,\n          \"max_shards\": 1\n        },\n        \"contract_version\": \"juntai.synthetic-data.contract/v1\",\n        \"output\": {\n          \"compression\": \"none\",\n          \"format\": \"jsonl\"\n        },\n        \"records\": [\n          {\n            \"count\": {\n              \"maximum\": 3\n            },\n            \"fields\": {\n              \"record_id\": {\n                \"distribution\": {\n                  \"kind\": \"uuid\"\n                },\n                \"type\": \"string\",\n                \"unique\": true\n              },\n              \"score\": {\n                \"distribution\": {\n                  \"kind\": \"uniform\",\n                  \"maximum\": 1,\n                  \"minimum\": 0\n                },\n                \"type\": \"number\"\n              }\n            },\n            \"record_type\": \"record\"\n          }\n        ]\n      },\n      \"policy\": {\n        \"data_classification\": \"synthetic\",\n        \"source_examples\": \"none\"\n      },\n      \"provider\": {\n        \"class\": \"tabular\",\n        \"requirements\": {\n          \"deterministic\": true,\n          \"maximum_runtime_seconds\": 60,\n          \"modes\": [\n            \"tabular\"\n          ]\n        }\n      },\n      \"seed\": \"documentation-example-v1\"\n    },\n    \"headers\": {\n      \"Authorization\": \"Bearer <access-token-aud-juntai.synthetic-data.api>\",\n      \"Idempotency-Key\": \"documentation-example-create-v1\"\n    },\n    \"method\": \"POST\",\n    \"path\": \"/v1/jobs/\"\n  }\n}\n","contentDigest":"sha256:19f9ead4c0ccfc6ef999dd3d83f8a9d234afdfba0c3af8a1d075ed2f4bd824be","kind":"example","lifecycle":"release","locale":"en","mcp":{"mimeType":"application/json","resourceId":"synthetic-data.example.create"},"order":100,"parentUnitId":"synthetic-data.workflow.create","schemaReferences":[],"sourcePath":"examples/create-job.json","title":"Create-job HTTP example","toolReferences":[],"unitId":"synthetic-data.example.create"},{"audiences":["human","agent","developer","operator"],"content":"{\n  \"expectedOutcome\": {\n    \"artifact\": {\n      \"artifact_id\": \"<registry-issued-artifact-id>\",\n      \"digest\": \"sha256:<immutable-artifact-digest>\",\n      \"media_type\": \"application/vnd.juntai.synthetic-dataset.v1+tar\",\n      \"version_id\": \"<registry-issued-version-id>\"\n    },\n    \"state\": \"SUCCEEDED\"\n  },\n  \"expectedToolCalls\": [],\n  \"input\": {\n    \"headers\": {\n      \"Authorization\": \"Bearer <access-token-aud-juntai.synthetic-data.api>\"\n    },\n    \"method\": \"GET\",\n    \"path\": \"/v1/jobs/<job_id>/result\"\n  }\n}\n","contentDigest":"sha256:c36e4c5f2feec93eedbceef6fbb22dc05d7d429ac49d0e765b7436fab821b2e8","kind":"example","lifecycle":"release","locale":"en","mcp":{"mimeType":"application/json","resourceId":"synthetic-data.example.result"},"order":110,"parentUnitId":"synthetic-data.workflow.result","schemaReferences":[],"sourcePath":"examples/job-result.json","title":"Successful-result HTTP example","toolReferences":[],"unitId":"synthetic-data.example.result"}]}}

ull\"}],\"title\":\"Deleted At\"},\"destinations\":{\"items\":{\"$ref\":\"#/components/schemas/DestinationResult\"},\"title\":\"Destinations\",\"type\":\"array\"},\"generation_id\":{\"pattern\":\"^gen_[0-9a-f]{32}$\",\"title\":\"Generation Id\",\"type\":\"string\"},\"provider\":{\"$ref\":\"#/components/schemas/ProviderView\"},\"record_count\":{\"minimum\":0.0,\"title\":\"Record Count\",\"type\":\"integer\"},\"request_digest\":{\"pattern\":\"^sha256:[0-9a-f]{64}$\",\"title\":\"Request Digest\",\"type\":\"string\"},\"seed\":{\"maxLength\":256,\"minLength\":1,\"title\":\"Seed\",\"type\":\"string\"},\"state\":{\"$ref\":\"#/components/schemas/GenerationState\"}},\"required\":[\"generation_id\",\"state\",\"request_digest\",\"contract_digest\",\"data_digest\",\"seed\",\"provider\",\"destinations\",\"record_count\",\"byte_count\",\"created_at\"],\"title\":\"GenerationResult\",\"type\":\"object\"},\"GenerationState\":{\"enum\":[\"COMMITTED\",\"DELETED\"],\"title\":\"GenerationState\",\"type\":\"string\"},\"HTTPValidationError\":{\"properties\":{\"detail\":{\"items\":{\"$ref\":\"#/components/schemas/ValidationError\"},\"title\":\"Detail\",\"type\":\"array\"}},\"title\":\"HTTPValidationError\",\"type\":\"object\"},\"PolicyRequest\":{\"additionalProperties\":false,\"properties\":{\"data_classification\":{\"default\":\"synthetic\",\"enum\":[\"synthetic\",\"internal\"],\"title\":\"Data Classification\",\"type\":\"string\"}},\"title\":\"PolicyRequest\",\"type\":\"object\"},\"ProviderRequest\":{\"additionalProperties\":false,\"properties\":{\"class\":{\"pattern\":\"^[a-z][a-z0-9.-]{0,62}$\",\"title\":\"Class\",\"type\":\"string\"},\"requirements\":{\"$ref\":\"#/components/schemas/ProviderRequirements\"}},\"required\":[\"class\"],\"title\":\"ProviderRequest\",\"type\":\"object\"},\"ProviderRequirements\":{\"additionalProperties\":false,\"properties\":{\"deterministic\":{\"const\":true,\"default\":true,\"title\":\"Deterministic\",\"type\":\"boolean\"},\"maximum_runtime_seconds\":{\"default\":300,\"exclusiveMinimum\":0.0,\"maximum\":3600.0,\"title\":\"Maximum Runtime Seconds\",\"type\":\"integer\"},\"modes\":{\"default\":[\"tabular\"],\"items\":{\"type\":\"string\"},\"title\":\"Modes\",\"type\":\"array\"}},\"title\":\"ProviderRequirements\",\"type\":\"object\"},\"ProviderView\":{\"additionalProperties\":false,\"properties\":{\"class\":{\"title\":\"Class\",\"type\":\"string\"},\"provider_id\":{\"title\":\"Provider Id\",\"type\":\"string\"},\"version\":{\"title\":\"Version\",\"type\":\"string\"}},\"required\":[\"class\",\"provider_id\",\"version\"],\"title\":\"ProviderView\",\"type\":\"object\"},\"RecordSpec\":{\"additionalProperties\":false,\"properties\":{\"count\":{\"exclusiveMinimum\":0.0,\"maximum\":1000000.0,\"title\":\"Count\",\"type\":\"integer\"},\"destination\":{\"$ref\":\"#/components/schemas/DestinationSpec\"},\"fields\":{\"maxProperties\":256,\"minProperties\":1,\"patternProperties\":{\"^[a-z][a-z0-9_]{0,62}$\":{\"$ref\":\"#/components/schemas/FieldSpec\"}},\"title\":\"Fields\",\"type\":\"object\"},\"record_type\":{\"pattern\":\"^[a-z][a-z0-9_]{0,62}$\",\"title\":\"Record Type\",\"type\":\"string\"}},\"required\":[\"record_type\",\"count\",\"destination\",\"fields\"],\"title\":\"RecordSpec\",\"type\":\"object\"},\"RelationSpec\":{\"additionalProperties\":false,\"properties\":{\"from\":{\"pattern\":\"^[a-z][a-z0-9_]{0,62}\\\\.[a-z][a-z0-9_]{0,62}$\",\"title\":\"From\",\"type\":\"string\"},\"required\":{\"default\":true,\"title\":\"Required\",\"type\":\"boolean\"},\"to\":{\"pattern\":\"^[a-z][a-z0-9_]{0,62}\\\\.[a-z][a-z0-9_]{0,62}$\",\"title\":\"To\",\"type\":\"string\"}},\"required\":[\"from\",\"to\"],\"title\":\"RelationSpec\",\"type\":\"object\"},\"ValidationError\":{\"properties\":{\"ctx\":{\"title\":\"Context\",\"type\":\"object\"},\"input\":{\"title\":\"Input\"},\"loc\":{\"items\":{\"anyOf\":[{\"type\":\"string\"},{\"type\":\"integer\"}]},\"title\":\"Location\",\"type\":\"array\"},\"msg\":{\"title\":\"Message\",\"type\":\"string\"},\"type\":{\"title\":\"Error Type\",\"type\":\"string\"}},\"required\":[\"loc\",\"msg\",\"type\"],\"title\":\"ValidationError\",\"type\":\"object\"},\"_HTTPErrorDetails\":{\"additionalProperties\":false,\"properties\":{\"issues\":{\"items\":{\"$ref\":\"#/components/schemas/_HTTPValidationIssue\"},\"title\":\"Issues\",\"type\":\"array\"},\"request_id\":{\"title\":\"Request Id\",\"type\":\"string\"},\"truncated\":{\"default\":false,\"title\":\"Truncated\",\"type\":\"boolean\"}},\"required\":[\"request_id\"],\"title\":\"_HTTPErrorDetails\",\"type\":\"object\"},\"_HTTPErrorEnvelope\":{\"additionalProperties\":false,\"properties\":{\"code\":{\"title\":\"Code\",\"type\":\"string\"},\"details\":{\"$ref\":\"#/components/schemas/_HTTPErrorDetails\"},\"message\":{\"title\":\"Message\",\"type\":\"string\"}},\"required\":[\"code\",\"message\",\"details\"],\"title\":\"_HTTPErrorEnvelope\",\"type\":\"object\"},\"_HTTPValidationIssue\":{\"description\":\"A bounded validation issue safe to return across the HTTP boundary.\",\"properties\":{\"location\":{\"items\":{\"anyOf\":[{\"type\":\"string\"},{\"type\":\"integer\"}]},\"title\":\"Location\",\"type\":\"array\"},\"type\":{\"title\":\"Type\",\"type\":\"string\"}},\"required\":[\"location\",\"type\"],\"title\":\"_HTTPValidationIssue\",\"type\":\"object\"}},\"securitySchemes\":{\"bearerAuth\":{\"bearerFormat\":\"JWT\",\"description\":\"Casdoor access token with exact audience juntai.synthetic-data.api.\",\"scheme\":\"bearer\",\"type\":\"http\"}}},\"info\":{\"title\":\"Juntai Synthetic Data Generation\",\"version\":\"1.3.0\"},\"openapi\":\"3.1.0\",\"paths\":{\"/v1/generations\":{\"post\":{\"operationId\":\"syntheticData.createGeneration\",\"parameters\":[{\"in\":\"header\",\"name\":\"Idempotency-Key\",\"required\":true,\"schema\":{\"title\":\"Idempotency-Key\",\"type\":\"string\"}}],\"requestBody\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/CreateGenerationRequest\"}}},\"required\":true},\"responses\":{\"200\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/GenerationResult\"}}},\"description\":\"Successful Response\"},\"400\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request does not match the endpoint contract\"},\"403\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request is not authorized for the destination\"},\"404\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Destination or entity was not found\"},\"409\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request authority has already been consumed\"},\"500\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request failed inside the framework boundary\"},\"503\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"HTTP adapter is not accepting requests\"},\"504\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request deadline was exceeded\"}},\"security\":[{\"bearerAuth\":[]}],\"summary\":\"Synchronously generate and commit preview application data\",\"tags\":[\"Synthetic Data Generations\"],\"x-juntai-iam\":{\"action\":\"create\",\"audience\":\"juntai.synthetic-data.api\",\"defaultDeny\":true,\"resource\":\"synthetic-data/generations\",\"tenantSource\":\"verified-casdoor-organization-or-delegated-workload\"}}},\"/v1/generations/{generation_id}\":{\"delete\":{\"operationId\":\"syntheticData.deleteGeneration\",\"parameters\":[{\"in\":\"path\",\"name\":\"generation_id\",\"required\":true,\"schema\":{\"title\":\"Generation Id\",\"type\":\"string\"}}],\"responses\":{\"200\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/GenerationResult\"}}},\"description\":\"Successful Response\"},\"400\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request does not match the endpoint contract\"},\"403\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request is not authorized for the destination\"},\"404\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Destination or entity was not found\"},\"409\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request authority has already been consumed\"},\"500\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request failed inside the framework boundary\"},\"503\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"HTTP adapter is not accepting requests\"},\"504\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request deadline was exceeded\"}},\"security\":[{\"bearerAuth\":[]}],\"summary\":\"Delete exactly the application rows written by a generation\",\"tags\":[\"Synthetic Data Generations\"],\"x-juntai-iam\":{\"action\":\"delete\",\"audience\":\"juntai.synthetic-data.api\",\"defaultDeny\":true,\"resource\":\"synthetic-data/generations/{generation_id}\",\"tenantSource\":\"verified-casdoor-organization-or-delegated-workload\"}},\"get\":{\"operationId\":\"syntheticData.getGeneration\",\"parameters\":[{\"in\":\"path\",\"name\":\"generation_id\",\"required\":true,\"schema\":{\"title\":\"Generation Id\",\"type\":\"string\"}}],\"responses\":{\"200\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/GenerationResult\"}}},\"description\":\"Successful Response\"},\"400\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request does not match the endpoint contract\"},\"403\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request is not authorized for the destination\"},\"404\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Destination or entity was not found\"},\"409\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request authority has already been consumed\"},\"500\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request failed inside the framework boundary\"},\"503\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"HTTP adapter is not accepting requests\"},\"504\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request deadline was exceeded\"}},\"security\":[{\"bearerAuth\":[]}],\"summary\":\"Recover committed or deleted generation metadata\",\"tags\":[\"Synthetic Data Generations\"],\"x-juntai-iam\":{\"action\":\"read\",\"audience\":\"juntai.synthetic-data.api\",\"defaultDeny\":true,\"resource\":\"synthetic-data/generations/{generation_id}\",\"tenantSource\":\"verified-casdoor-organization-or-delegated-workload\"}}}},\"security\":[{\"bearerAuth\":[]}]}\n"},"schemas":[],"units":[{"audiences":["human","agent","developer","operator"],"content":"# Synthetic Data Generation service\n\nSynthetic Data Generation is a small synchronous service used only in a Juntai test fleet. It\ncreates deterministic preview records and inserts them into the single application KingbaseES\ncluster supplied with that fleet. Application domains share that cluster while owning distinct\nschemas and tables.\n\nThe service runs generation, validation, application inserts, and its own metadata bookkeeping in\none process. It does not use a worker, queue, dispatcher, executor, Kafka, Artifact storage, or a\nPlatform runtime. Platform infrastructure may deploy the immutable service image and supply its\napplication-database binding, but it does not implement Synthetic behavior.\n\nEvery request names logical schema, table, generated-field-to-column mappings, and key fields.\nDatabase addresses, credentials, raw SQL, and tenant authority are never accepted in the API.\nAll requested application rows and the service's generation metadata/key ledger commit in one\ndatabase transaction or do not commit at all.\n\nUse `POST /v1/generations` to generate and commit records, `GET\n/v1/generations/{generation_id}` to recover a lost response, and `DELETE\n/v1/generations/{generation_id}` to delete exactly the rows written by that generation.\n","contentDigest":"sha256:e9b4b792443323d1a1b3a4f2aa1d14f9f74a8b42b57e5c4aa09b387a8db7a760","kind":"overview","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.overview"},"order":0,"schemaReferences":[],"sourcePath":"guides/overview.md","title":"Synthetic Data Generation service","toolReferences":[],"unitId":"synthetic-data.overview"},{"audiences":["human","agent","developer"],"content":"# Create application preview data\n\nSend `POST /v1/generations` with a bounded request and an `Idempotency-Key`. The authenticated IAM\nidentity supplies the tenant; the request supplies only generation rules and logical destinations.\n\nFor each record type, declare a positive count, generated fields, the destination schema/table, a\none-to-one field-to-column mapping, and the generated fields that map to an existing unique database\nkey. Relations declare which generated fields must match existing foreign keys between destinations.\n\nThe service validates the deployment allowlist and live database catalog before generation. It then\ngenerates in process and commits every application row, the generation result, and the exact written\nkeys in one transaction. A new commit returns `201`; replaying the same key and request returns the\nsame committed result with `200`. Reusing a key for changed content fails with\n`IDEMPOTENCY_KEY_REUSED`.\n","contentDigest":"sha256:df0fcc86f3a0780ff1da68b615e90bc25b8732dd9f84766edda86106ce74cbc1","kind":"workflow","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.workflow.create"},"order":10,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"workflows/create-generation.md","title":"Create application preview data","toolReferences":[],"unitId":"synthetic-data.workflow.create"},{"audiences":["human","agent","developer","operator"],"content":"# Recover or delete a generation\n\n`GET /v1/generations/{generation_id}` returns the committed result, including request, contract, and\ndata digests; provider identity; destinations and row counts; seed; and timestamps. Use it after a\nclient timeout or lost response instead of submitting changed content under the same idempotency key.\n\n`DELETE /v1/generations/{generation_id}` deletes only the rows named by the service-owned written-key\nledger. It deletes child rows before parents, marks the generation `DELETED`, and commits those\nchanges atomically. Repeating DELETE returns the same deleted result. If an application row is\nmissing, changed, or still referenced outside the generation, deletion fails and rolls back without\npartially removing the generation.\n\nDELETE is not asynchronous cancellation. Once POST returns, the generation is already committed.\n","contentDigest":"sha256:e6072b72c763659cac952d14b7da6427c1a8fcedad713208c768c426f22b157e","kind":"workflow","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.workflow.recover-delete"},"order":20,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"workflows/recover-and-delete.md","title":"Recover or delete a generation","toolReferences":[],"unitId":"synthetic-data.workflow.recover-delete"},{"audiences":["human","agent","developer"],"content":"# HTTP API and lifecycle\n\nAll routes require a bearer token for audience `juntai.synthetic-data.api` and the exact\ntenant-scoped authorization action.\n\n- `POST /v1/generations` requires `Idempotency-Key`. It returns `201` for a new atomic commit and\n  `200` for an identical replay.\n- `GET /v1/generations/{generation_id}` returns `COMMITTED` or `DELETED` metadata.\n- `DELETE /v1/generations/{generation_id}` atomically deletes exact keyed application rows and marks\n  the generation `DELETED`. Repeated deletion is idempotent.\n\nThere are no accepted, running, retrying, cancelling, failed-job, result-download, or worker states.\nTransient database failures receive only bounded request-local retries. If POST ultimately fails,\nthe database transaction contains neither application rows nor Synthetic generation evidence.\n","contentDigest":"sha256:8eab335da39d3986f87e53e0895e974056c4a48ab68ad5b8b5d54ad025c1ff76","kind":"reference","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.reference.api"},"order":30,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"reference/api-and-lifecycle.md","title":"HTTP API and lifecycle","toolReferences":[],"unitId":"synthetic-data.reference.api"},{"audiences":["human","agent","developer"],"content":"# Generation contract\n\nThe unpublished V1 request uses `juntai.synthetic-data.request/v1` and contains:\n\n- a deterministic seed and an in-process provider selection;\n- record types with positive counts and bounded fields;\n- per-record logical destination `{schema, table, columns, key_fields}`;\n- optional relations between generated fields; and\n- maximum total records and canonical generated-byte size.\n\n`columns` maps every generated field exactly once to a database column. `key_fields` names generated\nfields whose mapped columns form a live unique or primary key. A relation target must be unique, and\nthe relation must match a live database foreign key. V1 rejects relation graphs that cannot be\ninserted and deleted in a deterministic dependency order.\n\nThe request cannot select a database, host, port, DSN, credential, tenant, arbitrary connection\noption, or SQL fragment. Unknown fields are rejected. Provider output must match the exact declared\nrecord types, counts, field types, uniqueness constraints, relations, and bounds.\n","contentDigest":"sha256:8317bb0c9e9367a754205906a83a57e1d7980bdfd31f9f4e07e4a12f47730ef3","kind":"reference","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.reference.contract"},"order":40,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"reference/generation-contract.md","title":"Generation contract","toolReferences":[],"unitId":"synthetic-data.reference.contract"},{"audiences":["human","agent","developer","operator"],"content":"# Destination validation\n\nDeployment supplies one application KingbaseES connection and an exact logical destination\nallowlist. The service refuses startup or requests when that binding is absent, malformed, mutable,\nor outside the test-fleet deployment.\n\nBefore generating data, the service compares each destination with the allowlist and live catalog.\nThe table and every mapped column must exist; generated and database types must be compatible; every\nrequired column without a database default must be mapped; key fields must form a unique key; and\ndeclared relations must match live foreign keys. The service database role must have only the\nrequired insert, select, and delete permissions on approved application tables plus ownership of the\nservice metadata schema.\n\nIdentifiers are bounded lowercase SQL identifiers and are quoted by the service. Values are always\nbound parameters. The API never accepts raw SQL or physical connection information.\n","contentDigest":"sha256:ec1ce1cd9794a5ee23512de6a96ebdd5450b177c4c5a53e779d609d22af13e08","kind":"reference","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.reference.destination"},"order":50,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"reference/destination-validation.md","title":"Destination validation","toolReferences":[],"unitId":"synthetic-data.reference.destination"},{"audiences":["human","developer","operator"],"content":"# Migration and recovery\n\nThe service-owned migration command upgrades `juntai_synthetic_data` to the synchronous generation\nmetadata and exact written-key ledger. It retains immutable historical migrations for upgrade\nverification and removes their obsolete job/worker tables only in the reviewed forward migration.\nApplication schemas and rows are never created or migrated by this repository.\n\nMigration and runtime use the same Vangu-provided application KingbaseES cluster through a\nsecret-file DSN. Migrations are ordered, checksum-verified, transaction-locked, and forward-only.\nRe-pin a compatible prior service image for application rollback; schema reversal requires a new\nreviewed forward migration or an operator-approved restore.\n\nThe runtime retries only transient KingbaseES transaction/connectivity errors within the request\ndeadline. Idempotency and the database transaction provide recovery after a lost client response or\nservice restart; there is no background queue to drain.\n","contentDigest":"sha256:8e5241a4aca4aa37ecdc05e98940f45a7dbc5c1951ab660aaa45711103986069","kind":"reference","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.reference.migration"},"order":60,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"reference/migration-and-recovery.md","title":"Migration and recovery","toolReferences":[],"unitId":"synthetic-data.reference.migration"},{"audiences":["human","agent","developer","operator"],"content":"# Authorization and policy\n\nEvery operation requires a bearer token with exact audience `juntai.synthetic-data.api`, a verified\nhuman or live delegated-agent caller, the `synthetic-data:generations` scope, and authorization for\nthe tenant-scoped generation resource and action. Tenant identity comes only from the verified IAM\ncontext, never from a request field or caller-controlled header.\n\nThe runtime imports the immutable `juntai-iam==1.1.0` and `juntai-iam-contracts==1.1.1` releases and\nverifies the contract manifest before constructing authorization. It does not recreate token,\npeer-principal, delegation, or policy semantics.\n\nOnly `synthetic` and `internal` classifications are accepted. The service is test-fleet-only and\nmust not be admitted to a production application fleet. Destination authority is narrowed again by\nthe deployment allowlist and database grants.\n","contentDigest":"sha256:28ab92d26c52b116aa819901edbedc1f6517b86742d321b1c28567e21372421a","kind":"safety","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.safety.authorization"},"order":70,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"safety/authorization-and-policy.md","title":"Authorization and policy","toolReferences":[],"unitId":"synthetic-data.safety.authorization"},{"audiences":["human","agent","developer","operator"],"content":"# Database and data boundary\n\nSynthetic writes preview data only to approved application schemas in the test fleet's single\napplication database cluster. This is application data, not Platform data. The database role has no\nauthority over Platform databases, production application databases, unapproved schemas/tables, or\ndeployment control planes.\n\nThe service retains request/digest/provider/timestamp metadata and the exact generated keys required\nfor deletion. It does not retain duplicate generated payloads, export files, Artifact references,\nqueue messages, or worker state. Logs and telemetry contain bounded identifiers and digests, not\ngenerated row values or credentials.\n\nRLS isolates service metadata by verified tenant. Application-table isolation is enforced by the\nexisting application schema and tenant model; Synthetic does not weaken or replace it.\n","contentDigest":"sha256:6f63defe4798c11ee0670e076434ee839ffe5bfcb3d976ac2e4b844a7fbd25a2","kind":"safety","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.safety.database"},"order":80,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"safety/database-boundary.md","title":"Database and data boundary","toolReferences":[],"unitId":"synthetic-data.safety.database"},{"audiences":["human","agent","developer","operator"],"content":"# Stable failures and recovery\n\n- `CONTRACT_INVALID`: correct the bounded generation or destination mapping.\n- `PROVIDER_UNSUPPORTED`: choose an installed in-process provider with compatible requirements.\n- `POLICY_DENIED`: use an authorized test-fleet identity and permitted data classification.\n- `DESTINATION_FORBIDDEN`: choose a schema/table in the deployment allowlist; never broaden it from\n  the request.\n- `DESTINATION_INVALID`: reconcile mappings, types, defaults, unique keys, or foreign keys with the\n  live application schema.\n- `DESTINATION_CONFLICT`: change the seed/rules or remove the conflicting application key. The\n  failed transaction wrote nothing.\n- `OUTPUT_LIMIT_EXCEEDED`: reduce record or byte bounds.\n- `IDEMPOTENCY_KEY_REUSED`: replay the original identical content or choose a new key.\n- `DEPENDENCY_UNAVAILABLE`: retry the identical request after the database dependency recovers.\n- `GENERATION_NOT_FOUND`: verify tenant authority and the exact generation ID.\n- `DELETE_CONFLICT`: restore/reconcile externally changed rows before retrying exact deletion. The\n  failed deletion rolled back in full.\n\nNever recover by supplying database credentials in the API, widening the allowlist, changing a\nrequest under an existing idempotency key, issuing raw SQL, or deleting rows outside the exact ledger.\n","contentDigest":"sha256:94c323d72ecb0b8492bb33e310c8c149729cb8b27a3e5e9e6ea50e2790f7e871","kind":"troubleshooting","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.troubleshooting.failures"},"order":90,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"troubleshooting/stable-failures.md","title":"Stable failures and recovery","toolReferences":[],"unitId":"synthetic-data.troubleshooting.failures"},{"audiences":["human","agent","developer"],"content":"{\n  \"expectedOutcome\": {\"state\": \"COMMITTED\", \"status\": 201},\n  \"expectedToolCalls\": [],\n  \"input\": {\n    \"body\": {\n      \"generation_contract\": {\n        \"bounds\": {\"max_bytes\": 1048576, \"max_records\": 3},\n        \"records\": [{\n          \"count\": 3,\n          \"destination\": {\n            \"columns\": {\"record_id\": \"record_id\", \"score\": \"score\"},\n            \"key_fields\": [\"record_id\"],\n            \"schema\": \"preview_core\",\n            \"table\": \"entity\"\n          },\n          \"fields\": {\n            \"record_id\": {\"distribution\": {\"kind\": \"uuid\"}, \"type\": \"string\", \"unique\": true},\n            \"score\": {\"distribution\": {\"kind\": \"uniform\", \"maximum\": 1, \"minimum\": 0}, \"type\": \"number\"}\n          },\n          \"record_type\": \"entity\"\n        }]\n      },\n      \"policy\": {\"data_classification\": \"synthetic\"},\n      \"provider\": {\"class\": \"tabular\", \"requirements\": {\"deterministic\": true}},\n      \"seed\": \"documentation-example-v1\"\n    },\n    \"headers\": {\n      \"Authorization\": \"Bearer <access-token-aud-juntai.synthetic-data.api>\",\n      \"Idempotency-Key\": \"documentation-example-create-v1\"\n    },\n    \"method\": \"POST\",\n    \"path\": \"/v1/generations\"\n  }\n}\n","contentDigest":"sha256:33f1abca757e71f0bd9d06371087f97e7406e97e71a70d5c8f38e19598e72c1c","kind":"example","lifecycle":"release","locale":"en","mcp":{"mimeType":"application/json","resourceId":"synthetic-data.example.create"},"order":100,"parentUnitId":"synthetic-data.workflow.create","schemaReferences":[],"sourcePath":"examples/create-generation.json","title":"Create-generation HTTP example","toolReferences":[],"unitId":"synthetic-data.example.create"},{"audiences":["human","agent","developer","operator"],"content":"{\n  \"expectedOutcome\": {\"state\": \"DELETED\", \"status\": 200},\n  \"expectedToolCalls\": [],\n  \"input\": {\n    \"headers\": {\"Authorization\": \"Bearer <access-token-aud-juntai.synthetic-data.api>\"},\n    \"method\": \"DELETE\",\n    \"path\": \"/v1/generations/<generation_id>\"\n  }\n}\n","contentDigest":"sha256:a551ea0308a671ded3a7fda229b0a03b2bee28e6c96eddc4011e15c42e4d7fbb","kind":"example","lifecycle":"release","locale":"en","mcp":{"mimeType":"application/json","resourceId":"synthetic-data.example.delete"},"order":110,"parentUnitId":"synthetic-data.workflow.recover-delete","schemaReferences":[],"sourcePath":"examples/delete-generation.json","title":"Delete-generation HTTP example","toolReferences":[],"unitId":"synthetic-data.example.delete"}]}}

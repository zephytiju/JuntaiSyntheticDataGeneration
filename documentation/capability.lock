gated-workload\"}}},\"/v1/jobs/{job_id}/result\":{\"get\":{\"operationId\":\"syntheticData.getJobResult\",\"parameters\":[{\"in\":\"path\",\"name\":\"job_id\",\"required\":true,\"schema\":{\"title\":\"Job Id\",\"type\":\"string\"}}],\"responses\":{\"200\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/JobResult\"}}},\"description\":\"Successful Response\"},\"400\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request does not match the endpoint contract\"},\"403\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request is not authorized for the destination\"},\"404\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Destination or entity was not found\"},\"409\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request authority has already been consumed\"},\"500\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request failed inside the framework boundary\"},\"503\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"HTTP adapter is not accepting requests\"},\"504\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request deadline was exceeded\"}},\"security\":[{\"bearerAuth\":[]}],\"summary\":\"Read the exact immutable dataset Artifact result\",\"tags\":[\"Synthetic Data Jobs\"],\"x-juntai-iam\":{\"action\":\"read\",\"audience\":\"juntai.synthetic-data.api\",\"defaultDeny\":true,\"resource\":\"synthetic-data/jobs/{job_id}\",\"tenantSource\":\"verified-casdoor-organization-or-delegated-workload\"}}},\"/v1/jobs/{job_id}:cancel\":{\"post\":{\"operationId\":\"syntheticData.cancelJob\",\"parameters\":[{\"in\":\"path\",\"name\":\"job_id\",\"required\":true,\"schema\":{\"title\":\"Job Id\",\"type\":\"string\"}}],\"responses\":{\"200\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/JobStatus\"}}},\"description\":\"Successful Response\"},\"400\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request does not match the endpoint contract\"},\"403\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request is not authorized for the destination\"},\"404\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Destination or entity was not found\"},\"409\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request authority has already been consumed\"},\"500\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request failed inside the framework boundary\"},\"503\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"HTTP adapter is not accepting requests\"},\"504\":{\"content\":{\"application/json\":{\"schema\":{\"$ref\":\"#/components/schemas/_HTTPErrorEnvelope\"}}},\"description\":\"Request deadline was exceeded\"}},\"security\":[{\"bearerAuth\":[]}],\"summary\":\"Request best-effort job cancellation\",\"tags\":[\"Synthetic Data Jobs\"],\"x-juntai-iam\":{\"action\":\"cancel\",\"audience\":\"juntai.synthetic-data.api\",\"defaultDeny\":true,\"resource\":\"synthetic-data/jobs/{job_id}\",\"tenantSource\":\"verified-casdoor-organization-or-delegated-workload\"}}}},\"security\":[{\"bearerAuth\":[]}]}\n"},"schemas":[],"units":[{"audiences":["human","agent","developer","operator"],"content":"# Synthetic Data Generation\n\nSynthetic Data Generation 1.2.0 creates bounded, deterministic candidate datasets as immutable\nArtifacts. The service owns asynchronous jobs, structural contract validation, provider selection,\nprivacy policy, quota reservation, the `juntai.synthetic.worker/v1` protocol, isolated generation,\noptional exact validator execution, publication, and provenance.\n\nThe output is an immutable dataset Artifact. It is not imported application data and does not authorize a write to any target datastore. A separate authorized owner decides whether and how to ingest it.\n\n## Supported public flow\n\n- Create a job with `POST /v1/jobs/` and a bounded `Idempotency-Key`.\n- Poll `GET /v1/jobs/{job_id}` until a terminal state.\n- Request best-effort cancellation with `POST /v1/jobs/{job_id}:cancel` before publication commits.\n- Read an exact successful result with `GET /v1/jobs/{job_id}/result`.\n- Resolve dataset bytes only through the Artifact client using the returned exact reference.\n\n## Ownership boundary\n\nThe service accepts generic record families, primitive field types, distributions, relations, limits, output format, policy, provider requirements, seed, and an optional exact validator Artifact. It does not interpret product-domain meaning, receive target-store credentials, ingest results, deploy previews, or promote data.\n\nThe API coordinator alone writes Synthetic job metadata in KES. Platform owns the durable SWP\ndispatch, control, result, and dead-letter queues and the generic executor sidecar. The worker owns\ngeneration and immutable Artifact publication behind one canonical framed Unix socket. It has no\nKES, queue, Synthetic API, or Kubernetes API capability.\n\nThe pinned FuseAPI 2.0.0 MCP descriptor contains no Tools because this release exposes HTTP only.\nThis bundle therefore publishes MCP Resources for the same reviewed documentation units and does\nnot invent MCP Tools or Prompts.\n\n## Exact release binding\n\n- Service source: `a7511342311e84baf9f65045b8c9e72d4b3f23bd`.\n- OpenAPI: `sha256:26200a846179369af5c7f86e248f8eb1fa8085d62ddde994812ba348e68c93a8`.\n- MCP descriptor: `sha256:ca13c264d709c36382c02f9c120152b2c45765ae559d8a71529bdc1b60c89d21`.\n- SWP schema: `contracts/worker-protocol/swp.v1.schema.json` in the service release.\n- Documentation packager and renderers: `JuntaiDocumentationCapabilityBundle` `v1.0.0`\n","contentDigest":"sha256:66ad9358e0d25515b332ce5e3a2d1e34f7546a07c256201cf81849a3a99037d1","kind":"overview","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.overview"},"order":0,"schemaReferences":[],"sourcePath":"guides/overview.md","title":"Synthetic Data Generation service","toolReferences":[],"unitId":"synthetic-data.overview"},{"audiences":["human","agent","developer"],"content":"# Create a bounded generation job\n\n1. Obtain a human or delegated bearer token with audience `juntai.synthetic-data.api`, scope\n   `synthetic-data:jobs`, and authorization for action `create` on `synthetic-data/jobs`.\n2. Construct `juntai.synthetic-data.request/v1` with one generic `GenerationContract`, a non-empty seed, provider requirements, and policy.\n3. Set `Idempotency-Key` to a stable opaque value of at most 200 characters. Reuse it only for the identical canonical request.\n4. Call `POST /v1/jobs/` with JSON content.\n5. Persist the returned `job_id`, `request_digest`, state, and quota reservation for polling and\n   audit. Acceptance means the API has atomically committed the queued attempt and SWP dispatch\n   outbox after publishing the exact worker-input Artifact.\n\nThe service accepts the same key and identical canonical request as a replay of the same job. Reusing the key with different content fails with `IDEMPOTENCY_KEY_REUSED`.\n\nSchema-only generation is the default: use `source_examples: none`. A minimized source-derived request requires an explicit `authorization_reference` and remains subject to classification policy.\n\nDo not include credentials, target namespaces, executable expressions, unbounded counts, or mutable Artifact aliases in the request.\n","contentDigest":"sha256:ac50dc8b9c4f497b67ddbe8d285f89666de75153618908f5856c52f301d23e8c","kind":"workflow","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.workflow.create"},"order":10,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"workflows/create-job.md","title":"Create a bounded generation job","toolReferences":[],"unitId":"synthetic-data.workflow.create"},{"audiences":["human","agent","developer","operator"],"content":"# Monitor or cancel a job\n\nPoll `GET /v1/jobs/{job_id}` with bounded backoff. The response returns state, stage, timestamps, request digest, optimistic-concurrency version, bounded quota details, and a stable failure when present.\n\nThe normal sequence is `ACCEPTED`, `POLICY_CHECK`, `QUEUED`, `RUNNING`, `VALIDATING`, `PUBLISHING`, then `SUCCEEDED`. `FAILED` and `CANCELLED` are terminal. `CANCELLING` records a best-effort request in progress.\n\nTo cancel, obtain a correct-audience bearer token and authorization for action `cancel` on\n`synthetic-data/jobs/{job_id}` and call `POST /v1/jobs/{job_id}:cancel`. Cancellation is idempotent.\nThe API increments a monotonic cancel sequence and atomically records the control outbox. The\nexecutor forwards the highest sequence over the Unix socket, allows the specified grace interval,\nthen terminates the worker if necessary. A success arriving after cancellation committed is not\nassociated with the job. Cancellation cannot delete or mutate an Artifact whose publication already\ncommitted.\n\nDo not treat cancellation as revocation of an already published dataset. Retention and downstream authorization are separate concerns.\n","contentDigest":"sha256:494206fb4290f9399c267f46ebd2b5fa10b18b175294c4fad2c0cc190eeff112","kind":"workflow","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.workflow.monitor-cancel"},"order":20,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"workflows/monitor-and-cancel.md","title":"Monitor or cancel a job","toolReferences":[],"unitId":"synthetic-data.workflow.monitor-cancel"},{"audiences":["human","agent","developer","operator"],"content":"# Resolve a successful dataset result\n\n1. Confirm `GET /v1/jobs/{job_id}` reports `SUCCEEDED`.\n2. Obtain a bearer token with audience `juntai.synthetic-data.api` and authorization for action\n   `read` on `synthetic-data/jobs/{job_id}`.\n3. Call `GET /v1/jobs/{job_id}/result`.\n4. Verify the exact Artifact reference, dataset manifest digest, format, compression, counts, seed, validator result, and provenance.\n5. Resolve and download bytes through the approved backend Artifact client using `artifact_id`, `version_id`, and `digest` together.\n\nThe API does not return payload bytes, OCI credentials, target-store credentials, or a mutable download URL. `SUCCEEDED` means both direct OCI publication and generic metadata registration completed.\n\nPreserve provenance with the dataset reference. It binds request and contract digests, provider and model identity, seed, policy, quota reservation, worker image, validator evidence, logical dataset digest, Artifact digest, counts, shards, and timestamps.\n\n`SUCCEEDED` is committed only after the API coordinator verifies the authenticated Platform executor,\nexact tenant/attempt/input/image bindings, required SWP capabilities, dataset Artifact, and execution\nevidence Artifact. Replayed event IDs with the same digest are idempotent; a different digest is a\nconflict and never changes the result.\n","contentDigest":"sha256:fdbf2edfdfbc01de532c85460718bf3c9f79aeb55641d5d774a11593ddb72025","kind":"workflow","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.workflow.result"},"order":30,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"workflows/resolve-result.md","title":"Resolve a successful dataset result","toolReferences":[],"unitId":"synthetic-data.workflow.result"},{"audiences":["human","agent","developer"],"content":"# Exact HTTP API and lifecycle\n\nThis bundle binds the exact 1.2.0 OpenAPI digest\n`sha256:26200a846179369af5c7f86e248f8eb1fa8085d62ddde994812ba348e68c93a8`\ncopied from reviewed source `a7511342311e84baf9f65045b8c9e72d4b3f23bd`.\n\n| Method and path | Operation ID | Purpose |\n| --- | --- | --- |\n| `POST /v1/jobs/` | `syntheticData.createJob` | Create or replay an asynchronous job. |\n| `GET /v1/jobs/{job_id}` | `syntheticData.getJob` | Read bounded status and evidence. |\n| `POST /v1/jobs/{job_id}:cancel` | `syntheticData.cancelJob` | Request best-effort cancellation. |\n| `GET /v1/jobs/{job_id}/result` | `syntheticData.getJobResult` | Read one exact immutable result after success. |\n\nAll response models reject unknown fields. Digests use lowercase `sha256:` values. `JobStatus` carries `job_id`, `state`, `stage`, `request_digest`, version, timestamps, optional quota, and optional failure. `JobResult` carries one Artifact reference plus exact dataset and provenance facts.\n\nEvery operation uses the reviewed HTTP bearer scheme. Tokens must have the exact audience\n`juntai.synthetic-data.api` and scope `synthetic-data:jobs`. The service authenticates a human or\ndelegated identity, takes tenant authority only from the verified token, and authorizes `create`,\n`read`, or `cancel` against the exact job resource. Caller-supplied tenant identifiers are not\nauthoritative; missing, invalid, wrong-audience, or unauthorized credentials fail closed.\n\nCreating a job atomically records a SWP attempt and canonical dispatch outbox record after the\nimmutable input Artifact is published. Worker progress is visible only after the API coordinator\nauthenticates the pinned Platform executor, verifies the canonical envelope and exact Artifacts,\nand commits the event with the job transition in KES.\n\nThis release has no MCP Tools. Its exact FuseAPI descriptor is still packaged and verified so consumers fail closed if later builds add or change a runtime surface.\n","contentDigest":"sha256:3da763ed7b7226d37b5f40d9a0fd3b36fc0c18e3d5e20a9875bced300e2429ec","kind":"reference","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.reference.api"},"order":40,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"reference/api-and-lifecycle.md","title":"Exact HTTP API and lifecycle","toolReferences":[],"unitId":"synthetic-data.reference.api"},{"audiences":["human","agent","developer"],"content":"# Generation contract reference\n\n`juntai.synthetic-data.contract/v1` describes bounded structure only.\n\n- `records` contains 1 to 64 uniquely named record families.\n- Each family declares a positive maximum count and 1 to 256 fields.\n- Field types are `string`, `integer`, `number`, `boolean`, `date`, or `datetime`.\n- Distributions are `constant`, `sequence`, `choice`, `uniform`, `normal`, or `uuid` with kind-specific required parameters.\n- A relation uses `record.field` endpoints. Its target field must be declared unique.\n- `bounds` limits total records, bytes, and shards. Declared family counts must fit `max_records`.\n- Output is `jsonl` or `csv`, with `none` or `gzip` compression.\n- Metadata is bounded opaque text; it is not interpreted as domain semantics.\n\nHard public maxima are 1,000,000 records, 1,073,741,824 bytes, 15 shards, 64 record families, 256 fields per family, and 256 relations. Tenant policy and quota may impose lower limits.\n\nThe provider request declares class, deterministic requirement, modes, and maximum runtime. The default released provider class is `tabular`. Deterministic jobs pin the seed and provider behavior; a provider that cannot satisfy determinism fails before generation.\n","contentDigest":"sha256:4e4ef504ded5b18eb0dcfdc74e92901b6485a5b0c892edfdeebb8855f43b4509","kind":"reference","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.reference.contract"},"order":50,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"reference/generation-contract.md","title":"Generation contract reference","toolReferences":[],"unitId":"synthetic-data.reference.contract"},{"audiences":["human","agent","developer","operator"],"content":"# Exact validator Artifact reference\n\nA validator is optional. When supplied, it must contain immutable `artifact_id`, `version_id`, lowercase SHA-256 digest, media type, runtime, documented entry point, protocol versions, resource limits, and a deterministic declaration.\n\nThe service resolves the exact Artifact through `juntai-artifact-client`, verifies the returned manifest digest, and executes it in a no-network, read-only, non-root sandbox with bounded CPU, memory, time, and findings.\n\nThe entry point format is `module.path:function`. Supported runtimes are `python` and `wasm`. The validator input and output protocols are `juntai.synthetic-data.validator-input/v1` and `juntai.synthetic-data.validator-output/v1`.\n\nA validator must not start a server, database connection, engine, background thread, or network client. It must not mutate candidate data. Digest drift, side effects, timeout, unbounded findings, or a failed result prevents dataset publication.\n\nNever submit a mutable tag, unpinned package name, local filesystem path, or credential as a validator reference.\n","contentDigest":"sha256:4247da41732fb133203915992eed95526a76f5b09128f7c391c11a4243fd6992","kind":"reference","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.reference.validator"},"order":60,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"reference/validator-artifact.md","title":"Exact validator Artifact reference","toolReferences":[],"unitId":"synthetic-data.reference.validator"},{"audiences":["human","agent","developer","operator"],"content":"# Synthetic Worker Protocol v1\n\n`juntai.synthetic.worker/v1` is the only supported execution boundary. Platform owns durable queues\nnamed `synthetic.worker.dispatch.v1`, `synthetic.worker.control.v1`,\n`synthetic.worker.result.v1`, and `synthetic.worker.dead-letter.v1`. Synthetic owns the canonical\ndispatch, cancel, worker-event, Artifact, identity, resource, retry, and stable-error schemas.\n\nThe generic executor sidecar reads dispatch/control deliveries and starts the digest-pinned worker.\nIt uses `/var/run/juntai-worker/swp-v1.sock`, owned by `root:juntai-worker` with mode `0660`.\nEach frame is a four-byte unsigned big-endian length followed by at most 1,048,576 bytes of canonical\nRFC 8785 UTF-8 JSON. Unknown members, duplicate members, non-canonical bytes, unsupported majors,\ndigest mismatch, or transport/producer identity mismatch fail closed.\n\nDispatch carries exact tenant, job, attempt, sequence, deadline, correlation, input Artifact,\nrequest digest, provider/version, worker image, capabilities, executor binding, resource envelope,\nand idempotency digest. Worker events carry lease, stage/progress, observed cancellation sequence,\nimage/capabilities, evidence counters, and—when terminal—outcome, times, consumed input digest,\nimmutable execution evidence, stable error, and successful dataset Artifact/counts.\n\nQueue visibility is 60 seconds and the executor renews every 20 seconds. It acknowledges dispatch\nonly after the API durably commits the terminal result disposition. Retryable failures use full\njitter from zero through `min(300, 5 * 2^(delivery_count-1))` seconds, at most five deliveries,\nwithin the original deadline and six-hour maximum lease. Exhausted/non-retryable deliveries go to\nthe DLQ with the original canonical bytes and bounded failure evidence. Cancellation is monotonic;\nthe executor allows 30 seconds for graceful worker exit and a 60-second termination allowance.\n\nThe API outbox makes dispatch/control publication replayable. The result inbox makes event IDs\nidempotent and detects digest conflicts. On restart, the API reconciles pending outbox records and\nnonterminal attempts; the executor relies on queue redelivery and exact attempt identity. A new\nworker image is rolled out only after protocol/real-KES/isolation acceptance. Rollback re-pins a\ncompatible prior image; migrations remain forward-only and no component performs a destructive\nimplicit downgrade.\n","contentDigest":"sha256:5481810cb47dc4bf238b648707178c4791cdf73c5cfb7b026dc725162116e31f","kind":"reference","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.reference.worker-protocol"},"order":65,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"reference/worker-protocol.md","title":"Synthetic Worker Protocol v1","toolReferences":[],"unitId":"synthetic-data.reference.worker-protocol"},{"audiences":["human","agent","developer","operator"],"content":"# Authorization, policy, and approvals\n\nEvery operation requires a bearer access token with exact audience `juntai.synthetic-data.api`,\nverified human or delegated identity, the `synthetic-data:jobs` scope, and an authorization decision\nfor the exact resource and action. Service tokens without the required caller context are not a\nsubstitute.\n\nThe default policy permits `synthetic` and `internal` classifications. It denies `confidential` and `restricted` requests. `source_examples` defaults to `none`; `minimized` requires an explicit `authorization_reference`. Validators must declare deterministic behavior.\n\nQuota is reserved before execution for concurrent jobs, daily jobs, records, bytes, compute time, provider class, model tokens, and retained evidence. A caller must reduce bounds or wait for the reported quota window rather than bypass policy.\n\nCreating a job authorizes bounded generation only. It does not authorize ingestion, mutation of an authoritative datastore, preview deployment, or production promotion. Those decisions remain with the separately authorized owner.\n\nCancellation is best effort before publication commit. Confirm the intended `job_id`; cancelling one job cannot revoke or rewrite an already published Artifact.\n\nSWP result messages require the pinned Platform executor workload identity and the job tenant,\nattempt, worker image, input digest, and required protocol capabilities. Transport identity,\n`producerWorkload`, and content digest must agree. The API rejects spoofed or stale results and is\nthe sole component permitted to change job state in KES.\n","contentDigest":"sha256:01f154be2ddeaaacc33a69c638f33637775486f261c67480246bcb09f1837687","kind":"safety","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.safety.authorization"},"order":70,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"safety/authorization-and-policy.md","title":"Authorization, policy, and approvals","toolReferences":[],"unitId":"synthetic-data.safety.authorization"},{"audiences":["human","agent","developer","operator"],"content":"# Privacy, isolation, and immutable output\n\nPrefer schema-only generation. Do not send secrets, credentials, protected payloads, raw production rows, target-store bindings, or unrestricted source examples.\n\nWorkers use digest-pinned images, read-only roots, bounded CPU, memory, process, time, and storage,\nleast-privileged Artifact publication identity, and ephemeral workspaces. The worker receives only\nexact Artifact credentials and `/var/run/juntai-worker/swp-v1.sock`. It must not receive a KES DSN,\nKES secret or mount, queue endpoint/token, Synthetic API credential, service-account token,\nKubernetes API configuration, or network route to KES, queue, Synthetic API, or Kubernetes API.\nPlatform allows only the reviewed Artifact Registry/OCI endpoints. Validator isolation is stricter\nand has no network.\n\nCandidate files remain bounded by the request and quota. The worker creates canonical shards and a manifest, publishes bytes directly through the Artifact SDK to OCI, verifies digests and media types, registers generic metadata, records the exact reference, and removes temporary data.\n\nProvenance must not contain credentials or target-store authority. Telemetry uses bounded identifiers and digests, not dataset payloads or authored documentation bodies.\n\nEvery successful job points to one immutable Artifact. Never replace an exact digest with `latest`, a channel, a short-lived URL, or a local path.\n\nThe generic executor sidecar owns queue visibility, acknowledgement, renewal, retries, DLQ routing,\nsocket permissions, and process termination. It runs beside—but is not part of—the worker. A local\nproduction-equivalent acceptance run places the worker on an internal network that cannot resolve\nor connect to the real-KES container and fails if any forbidden configuration or mount is present.\n","contentDigest":"sha256:b6928a26f6de0164c258295c606e8c12cb0672b7c2399d2a1bbecc35fe5b7c45","kind":"safety","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.safety.isolation"},"order":80,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"safety/privacy-and-isolation.md","title":"Privacy, isolation, and immutable output","toolReferences":[],"unitId":"synthetic-data.safety.isolation"},{"audiences":["human","agent","developer","operator"],"content":"# Stable failures and recovery\n\n- `CONTRACT_INVALID`: correct the structural contract; do not retry unchanged input.\n- `PROVIDER_UNSUPPORTED` or `DETERMINISTIC_SEED_INCOMPATIBLE`: choose supported declared requirements.\n- `POLICY_DENIED`: remove disallowed input or obtain the required authorization; do not bypass policy.\n- `QUOTA_EXCEEDED`: reduce bounds or wait for the quota window. The failure is retryable only as reported.\n- `IDEMPOTENCY_KEY_REUSED`: use the original identical request or a new key for changed content.\n- `VALIDATOR_FAILED` or `SANDBOX_VIOLATION`: correct the exact validator or candidate contract. No dataset is published.\n- `OUTPUT_LIMIT_EXCEEDED`: reduce record or byte bounds. Temporary data is removed.\n- `PUBLICATION_FAILED`, `DEPENDENCY_UNAVAILABLE`, or `DEPENDENCY_DEADLINE`: retry identical content with bounded backoff only when `retryable` is true.\n- `JOB_NOT_FOUND`: verify tenant authority and exact job ID.\n- `JOB_NOT_SUCCEEDED`: continue polling or inspect the terminal failure before requesting a result.\n- `JOB_CANCELLED`: create a new job if generation is still required.\n- `CONCURRENCY_CONFLICT`: reread status and retry the intended operation against current state.\n- `PROTOCOL_UNSUPPORTED` or `ENVELOPE_INVALID`: quarantine the delivery; deploy an executor that\n  supports SWP/v1 rather than rewriting the frame.\n- `ENVELOPE_DIGEST_MISMATCH`, `IDENTITY_MISMATCH`, `TENANT_MISMATCH`, or `RESULT_CONFLICT`: fail\n  closed and investigate transport/integrity evidence; never acknowledge as success.\n- `ATTEMPT_STALE` or `RESULT_DUPLICATE`: do not reapply job state. Record cleanup evidence for any\n  newly published orphan Artifact.\n- `WORKER_EXITED` or retryable `DEPENDENCY_UNAVAILABLE`: redeliver with full-jitter backoff inside\n  the original deadline and delivery budget.\n- `DELIVERY_EXHAUSTED`: inspect the dead-letter record and immutable evidence. Automated retries\n  stop after five deliveries.\n- `ARTIFACT_INTEGRITY_FAILED`: do not associate the output; exact coordinates, tenant, media type,\n  producer build, or digest verification failed.\n\nNever recover by weakening digest checks, switching to a mutable input, querying private storage, or treating a partial upload as a successful result.\n","contentDigest":"sha256:d87b4c933e3a644de977303f3e5c74f21fdb12a7a74cb2caca078d2cc69c4724","kind":"troubleshooting","lifecycle":"release","locale":"en","mcp":{"mimeType":"text/markdown","resourceId":"synthetic-data.troubleshooting.failures"},"order":90,"parentUnitId":"synthetic-data.overview","schemaReferences":[],"sourcePath":"troubleshooting/stable-failures.md","title":"Stable failures and recovery","toolReferences":[],"unitId":"synthetic-data.troubleshooting.failures"},{"audiences":["human","agent","developer"],"content":"{\n  \"expectedOutcome\": {\n    \"request_digest\": \"sha256:<canonical-request-digest>\",\n    \"state\": \"ACCEPTED\"\n  },\n  \"expectedToolCalls\": [],\n  \"input\": {\n    \"body\": {\n      \"contract_version\": \"juntai.synthetic-data.request/v1\",\n      \"generation_contract\": {\n        \"bounds\": {\n          \"max_bytes\": 1048576,\n          \"max_records\": 3,\n          \"max_shards\": 1\n        },\n        \"contract_version\": \"juntai.synthetic-data.contract/v1\",\n        \"output\": {\n          \"compression\": \"none\",\n          \"format\": \"jsonl\"\n        },\n        \"records\": [\n          {\n            \"count\": {\n              \"maximum\": 3\n            },\n            \"fields\": {\n              \"record_id\": {\n                \"distribution\": {\n                  \"kind\": \"uuid\"\n                },\n                \"type\": \"string\",\n                \"unique\": true\n              },\n              \"score\": {\n                \"distribution\": {\n                  \"kind\": \"uniform\",\n                  \"maximum\": 1,\n                  \"minimum\": 0\n                },\n                \"type\": \"number\"\n              }\n            },\n            \"record_type\": \"record\"\n          }\n        ]\n      },\n      \"policy\": {\n        \"data_classification\": \"synthetic\",\n        \"source_examples\": \"none\"\n      },\n      \"provider\": {\n        \"class\": \"tabular\",\n        \"requirements\": {\n          \"deterministic\": true,\n          \"maximum_runtime_seconds\": 60,\n          \"modes\": [\n            \"tabular\"\n          ]\n        }\n      },\n      \"seed\": \"documentation-example-v1\"\n    },\n    \"headers\": {\n      \"Authorization\": \"Bearer <access-token-aud-juntai.synthetic-data.api>\",\n      \"Idempotency-Key\": \"documentation-example-create-v1\"\n    },\n    \"method\": \"POST\",\n    \"path\": \"/v1/jobs/\"\n  }\n}\n","contentDigest":"sha256:19f9ead4c0ccfc6ef999dd3d83f8a9d234afdfba0c3af8a1d075ed2f4bd824be","kind":"example","lifecycle":"release","locale":"en","mcp":{"mimeType":"application/json","resourceId":"synthetic-data.example.create"},"order":100,"parentUnitId":"synthetic-data.workflow.create","schemaReferences":[],"sourcePath":"examples/create-job.json","title":"Create-job HTTP example","toolReferences":[],"unitId":"synthetic-data.example.create"},{"audiences":["human","agent","developer","operator"],"content":"{\n  \"expectedOutcome\": {\n    \"artifact\": {\n      \"artifact_id\": \"<registry-issued-artifact-id>\",\n      \"digest\": \"sha256:<immutable-artifact-digest>\",\n      \"media_type\": \"application/vnd.juntai.synthetic-dataset.v1+tar\",\n      \"version_id\": \"<registry-issued-version-id>\"\n    },\n    \"state\": \"SUCCEEDED\"\n  },\n  \"expectedToolCalls\": [],\n  \"input\": {\n    \"headers\": {\n      \"Authorization\": \"Bearer <access-token-aud-juntai.synthetic-data.api>\"\n    },\n    \"method\": \"GET\",\n    \"path\": \"/v1/jobs/<job_id>/result\"\n  }\n}\n","contentDigest":"sha256:c36e4c5f2feec93eedbceef6fbb22dc05d7d429ac49d0e765b7436fab821b2e8","kind":"example","lifecycle":"release","locale":"en","mcp":{"mimeType":"application/json","resourceId":"synthetic-data.example.result"},"order":110,"parentUnitId":"synthetic-data.workflow.result","schemaReferences":[],"sourcePath":"examples/job-result.json","title":"Successful-result HTTP example","toolReferences":[],"unitId":"synthetic-data.example.result"}]}}

name: Licensed release acceptance

on:
  workflow_call:
    inputs:
      source_revision:
        description: Exact published Synthetic source commit
        required: true
        type: string
      image_digest:
        description: Exact published Synthetic multiarch image digest
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact published Synthetic source commit
        required: true
        type: string
      image_digest:
        description: Exact published Synthetic multiarch image digest
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  licensed-kes:
    runs-on: [self-hosted, juntai-platform]
    env:
      IMAGE: ghcr.io/zephytiju/juntai-synthetic-data-generation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate and resolve exact inputs
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          docker pull "$IMAGE@$IMAGE_DIGEST"
          docker tag "$IMAGE@$IMAGE_DIGEST" juntai-synthetic-data-generation:release-acceptance
      - name: Run Synthetic licensed-KES migration/relay/replay/rollback suite
        env:
          JUNTAI_SOURCE_REVISION: ${{ inputs.source_revision }}
          JUNTAI_SERVICE_IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          sh scripts/run-real-kes-acceptance.sh \
            juntai-synthetic-data-generation:release-acceptance \
            "$RUNNER_TEMP/synthetic-real-kes-acceptance.json"
      - name: Record exact Synthetic and IAM identities
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          printf '%s\n' \
            "syntheticSource=$SOURCE_REVISION" \
            "syntheticImage=$IMAGE@$IMAGE_DIGEST" \
            "iam=1.1.0@72b481ed825c00d0bd96feca67790e90dc5ace9b" \
            "iamContracts=1.1.1@a37b6d6daaba75efd8c15c19b440a3081ba761c5" \
            > "$RUNNER_TEMP/release-acceptance-identities.txt"
      - uses: actions/upload-artifact@v5
        with:
          name: synthetic-data-release-acceptance-${{ inputs.source_revision }}
          path: |
            ${{ runner.temp }}/synthetic-real-kes-acceptance.json
            ${{ runner.temp }}/release-acceptance-identities.txt
          if-no-files-found: error
          retention-days: 90

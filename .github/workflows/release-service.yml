name: Release immutable Synthetic service and KES migrations

on:
  push:
    branches: ["main"]
    paths: ["release-evidence/synthetic-data-v1.3.0.json"]

permissions:
  contents: write
  packages: read
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/zephytiju/juntai-synthetic-data-generation
      RELEASE_TAG: synthetic-data-v1.3.0
      DOCUMENTATION_TAG: synthetic-data-docs-v1.3.0
      VERSION: 1.3.0
      REAL_KES_EVIDENCE: release-evidence/synthetic-data-v1.3.0.json
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact evidence, source, and main ancestry
        run: |
          release_sha="$(python -c 'import json,os; print(json.load(open(os.environ["REAL_KES_EVIDENCE"]))["sourceRevision"])')"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$release_sha" origin/main
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"
          cp "$REAL_KES_EVIDENCE" /tmp/real-kes-acceptance.json
          git checkout --detach "$release_sha"
          test "$(git rev-parse HEAD)" = "$release_sha"
          test "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "$VERSION"
      - name: Require official immutable Platform adapter publication
        run: sh scripts/require-published-platform-adapters.sh
      - name: Resolve and verify the already-published exact source image
        run: |
          docker buildx imagetools inspect "$IMAGE:sha-$RELEASE_SHA" --raw > /tmp/image-index.json
          resolved="sha256:$(sha256sum /tmp/image-index.json | cut -d ' ' -f 1)"
          evidence="$(python -c 'import json; print(json.load(open("/tmp/real-kes-acceptance.json"))["serviceImageDigest"])')"
          test "$resolved" = "$evidence"
          echo "IMAGE_DIGEST=$resolved" >> "$GITHUB_ENV"
      - name: Install, lint, test, and build deterministic wheel
        run: |
          python -m pip install --find-links .platform-adapters --find-links .iam-artifacts -e '.[test]'
          ruff check .
          ruff format --check .
          python scripts/generate_openapi.py
          python scripts/generate_worker_protocol.py
          python scripts/generate_fixture.py
          python scripts/generate_documentation_contracts.py
          git diff --exit-code -- openapi contracts/worker-protocol fixtures documentation/contracts
          pytest -q
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$RELEASE_SHA")"
          python -m build --wheel
      - name: Compose exact release assets
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$RELEASE_SHA")"
          python scripts/generate_service_release.py \
            --out dist/release-assets \
            --wheel dist/juntai_synthetic_data_generation-1.3.0-py3-none-any.whl \
            --real-kes-evidence /tmp/real-kes-acceptance.json \
            --repository "$GITHUB_REPOSITORY" \
            --source-revision "$RELEASE_SHA" \
            --image "$IMAGE" \
            --image-digest "$IMAGE_DIGEST" \
            --run-id "$GITHUB_RUN_ID" \
            --platform-contract-manifest .platform-adapters/manifest.json \
            --iam-wheel .iam-artifacts/juntai_iam-1.1.0-py3-none-any.whl \
            --iam-contracts-wheel .iam-artifacts/juntai_iam_contracts-1.1.1-py3-none-any.whl
          cd dist/release-assets
          sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/release-assets/*
      - name: Create or verify exact annotated release tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          evidence_base64="$(base64 < /tmp/real-kes-acceptance.json | tr -d '\n')"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          ensure_tag() {
            tag="$1"
            title="$2"
            release_ref="refs/release-tags/$tag"
            if test -n "$(git ls-remote --tags origin "refs/tags/$tag")"; then
              git fetch --force origin "refs/tags/$tag:$release_ref"
              test "$(git cat-file -t "$release_ref")" = tag
              test "$(git rev-list -n 1 "$release_ref")" = "$RELEASE_SHA"
            else
              git tag -a "$tag" "$RELEASE_SHA" -m "$title"
              git push origin "refs/tags/$tag"
              git update-ref "$release_ref" "refs/tags/$tag"
            fi
          }

          ensure_tag "$RELEASE_TAG" "Synthetic Data 1.3.0 immutable release

          REAL_KES_EVIDENCE_BASE64=$evidence_base64"
          ensure_tag "$DOCUMENTATION_TAG" "Synthetic Data documentation capability 1.3.0"
          service_message="$(git for-each-ref --format='%(contents)' "refs/release-tags/$RELEASE_TAG")"
          printf '%s\n' "$service_message" | grep -Fqx \
            "REAL_KES_EVIDENCE_BASE64=$evidence_base64"
      - name: Publish and lock immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release view "$RELEASE_TAG" --json isImmutable --jq '.isImmutable' | grep -x true
          else
            gh release create "$RELEASE_TAG" \
              dist/release-assets/* \
              --verify-tag \
              --title "Synthetic Data service, relay, SWP/v1, and KES migrations 1.3.0" \
              --notes "Service-owned transactional SWP/v1 relay and inbox semantics, Platform-owned durable queue/executor integration, exact IAM 1.1 tuple, forward-only job-metadata KES migrations, real KingbaseES acceptance, and digest-pinned multiarch image $IMAGE_DIGEST. Prior Synthetic tags and releases remain unchanged."
          fi
      - name: Verify immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG" --json isImmutable --jq '.isImmutable' | grep -x true

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PLATFORM_ADAPTER_EVIDENCE_COMMIT: 9095fde4bee086fd62a2868cabc079a0917af84d

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Prepare exact IAM and Platform adapter artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JUNTAI_UPSTREAM_AUDIT_TOKEN: ${{ secrets.JUNTAI_UPSTREAM_AUDIT_TOKEN }}
        run: sh scripts/prepare-external-dependencies.sh
      - run: python -m pip install --find-links .platform-adapters --find-links .iam-artifacts -e '.[test]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python scripts/generate_openapi.py
      - run: python scripts/generate_worker_protocol.py
      - run: python scripts/generate_fixture.py
      - run: git diff --exit-code -- openapi contracts/worker-protocol fixtures
      - run: pytest -q
      - run: python -m build
      - name: Verify wheel install and public surface
        run: |
          python -m venv /tmp/juntai-synthetic-wheel
          /tmp/juntai-synthetic-wheel/bin/pip install \
            --find-links .platform-adapters --find-links .iam-artifacts dist/*.whl
          /tmp/juntai-synthetic-wheel/bin/python -c "import juntai_synthetic_data; assert juntai_synthetic_data.__version__ == '1.3.0'"
          /tmp/juntai-synthetic-wheel/bin/python -c "from juntai_synthetic_data.iam_contract import validate_iam_runtime; validate_iam_runtime()"
          /tmp/juntai-synthetic-wheel/bin/juntai-synthetic-data migrate --print-manifest > /tmp/migration-set.json
          grep -q af29058d1ca61516415cc3b3f877987012c371fba5fdec0170bc83dc76c19822 /tmp/migration-set.json
          grep -q 3e1938165b6ff0bcc9dcfc80288e74f32715474e259f82b346307724c0809779 /tmp/migration-set.json
          grep -q 35bae91e58131efe36af88ca7c39d4219148faa757216968b1f52e33c61df698 /tmp/migration-set.json

  image:
    name: Image contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Prepare exact IAM and Platform adapter artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JUNTAI_UPSTREAM_AUDIT_TOKEN: ${{ secrets.JUNTAI_UPSTREAM_AUDIT_TOKEN }}
        run: sh scripts/prepare-external-dependencies.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: |
            adapter-artifacts=.platform-adapters
            iam-artifacts=.iam-artifacts
          load: true
          tags: juntai-synthetic-data-generation:ci
      - run: docker image inspect juntai-synthetic-data-generation:ci --format '{{.Id}}'
      - run: |
          test "$(docker image inspect juntai-synthetic-data-generation:ci --format '{{.Config.User}}')" = "65532:65532"
          test "$(docker image inspect juntai-synthetic-data-generation:ci --format '{{json .Config.Entrypoint}}')" = '["juntai-synthetic-data"]'
          docker run --rm --entrypoint python juntai-synthetic-data-generation:ci -c \
            'from juntai_synthetic_data.iam_contract import validate_iam_runtime; validate_iam_runtime()'
          docker run --rm juntai-synthetic-data-generation:ci migrate --print-manifest > /tmp/image-migration-set.json
          grep -q af29058d1ca61516415cc3b3f877987012c371fba5fdec0170bc83dc76c19822 /tmp/image-migration-set.json
          grep -q 3e1938165b6ff0bcc9dcfc80288e74f32715474e259f82b346307724c0809779 /tmp/image-migration-set.json
          grep -q 35bae91e58131efe36af88ca7c39d4219148faa757216968b1f52e33c61df698 /tmp/image-migration-set.json
          if docker run --rm --network none \
            -e JUNTAI_JOB_DATABASE_DSN=forbidden \
            juntai-synthetic-data-generation:ci worker >/tmp/worker.out 2>/tmp/worker.err; then exit 1; fi
          grep -q 'forbidden worker configuration' /tmp/worker.err

  documentation:
    name: Documentation capability
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCUMENTATION_WHEEL: /tmp/juntai_documentation_capability-1.0.0-py3-none-any.whl
      DOCUMENTATION_WHEEL_SHA256: 82995a96601f8249ca85bfd51cfb5fe34c3a2d8608ff7b0d42c5004a59843c33
      RELEASE_TAG: synthetic-data-docs-v1.3.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Prepare exact IAM and Platform adapter artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JUNTAI_UPSTREAM_AUDIT_TOKEN: ${{ secrets.JUNTAI_UPSTREAM_AUDIT_TOKEN }}
        run: sh scripts/prepare-external-dependencies.sh
      - name: Install service and exact Documentation Capability release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --find-links .platform-adapters --find-links .iam-artifacts -e '.[test]'
          python -m pip install 'juntai-fuse-api[http]==2.0.0'
          gh release download v1.0.0 \
            --repo zephytiju/JuntaiDocumentationCapabilityBundle \
            --pattern juntai_documentation_capability-1.0.0-py3-none-any.whl \
            --output "$DOCUMENTATION_WHEEL"
          python -c 'import hashlib,os,pathlib; p=pathlib.Path(os.environ["DOCUMENTATION_WHEEL"]); assert hashlib.sha256(p.read_bytes()).hexdigest() == os.environ["DOCUMENTATION_WHEEL_SHA256"]'
          python -m pip install "$DOCUMENTATION_WHEEL"
          python -c 'import importlib.metadata as m; assert m.version("juntai-documentation-capability") == "1.0.0"; assert m.version("juntai-fuse-api") == "2.0.0"'
      - name: Verify exact source contracts and locked graph
        run: |
          (cd documentation/contracts && sha256sum -c openapi.sha256 && sha256sum -c mcp-descriptor.sha256)
          python -c 'import yaml; m=yaml.safe_load(open("documentation/manifest.yaml")); assert m["metadata"]["producerBuildId"] == "5e0a11759457b76f4ed8e232128921a78c710806"'
          git diff --exit-code -- documentation
          juntai-capability resolve --manifest documentation/manifest.yaml --lock /tmp/capability.lock
          cmp documentation/capability.lock /tmp/capability.lock
          juntai-capability validate --lock documentation/capability.lock
      - name: Prove two clean builds are byte-identical
        run: |
          juntai-capability build --lock documentation/capability.lock --out /tmp/capability-first
          juntai-capability build --lock documentation/capability.lock --out /tmp/capability-second
          diff -qr /tmp/capability-first /tmp/capability-second
      - name: Verify publication result, pin, and signed catalog handoff
        run: |
          python scripts/generate_documentation_publication.py \
            --build /tmp/capability-first \
            --out /tmp/release-assets \
            --release-tag "$RELEASE_TAG" \
            --attestation-id "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          juntai-capability verify \
            --bundle /tmp/capability-first \
            --pin /tmp/release-assets/CapabilityPublicationResult.json
          juntai-capability catalog compile \
            --records /tmp/release-assets/catalog-record.json \
            --signature /tmp/release-assets/catalog-signature.json \
            --out /tmp/release-assets/catalog-index.json
          python scripts/verify_documentation_publication.py \
            --build /tmp/capability-first \
            --publication /tmp/release-assets/CapabilityPublicationResult.json \
            --catalog /tmp/release-assets/catalog-index.json \
            --selection-request /tmp/release-assets/selection-request.json \
            --out /tmp/release-assets/CapabilityVerificationResult.json
      - uses: actions/upload-artifact@v5
        with:
          name: synthetic-data-documentation-${{ github.sha }}
          path: /tmp/release-assets/*
          if-no-files-found: error
          retention-days: 90

  real-kafka:
    name: Exact Platform Kafka 4.1.1
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka@sha256:0bc1bb2478f45b6cea78864df86acdc11e8df2c5172477819a4d12942cbe5d40
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check out the exact Platform backend source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JUNTAI_UPSTREAM_AUDIT_TOKEN: ${{ secrets.JUNTAI_UPSTREAM_AUDIT_TOKEN }}
        run: |
          token="${JUNTAI_UPSTREAM_AUDIT_TOKEN:-${GITHUB_TOKEN}}"
          GH_TOKEN="$token" gh repo clone zephytiju/JuntaiPlatformInfrastructure \
            "$RUNNER_TEMP/juntai-platform" -- --filter=blob:none
          git -C "$RUNNER_TEMP/juntai-platform" checkout --detach "$PLATFORM_ADAPTER_EVIDENCE_COMMIT"
          test "$(git -C "$RUNNER_TEMP/juntai-platform" rev-parse HEAD)" = \
            "$PLATFORM_ADAPTER_EVIDENCE_COMMIT"
      - name: Run the exact Platform-ledger Kafka transaction
        working-directory: ${{ runner.temp }}/juntai-platform
        env:
          RUN_REAL_QUEUE_KAFKA_PROVIDER: "1"
          JUNTAI_REAL_KAFKA_BROKER: 127.0.0.1:9092
        run: |
          npm ci
          npx vitest run tests/integration/queue-kafka-provider.test.ts
